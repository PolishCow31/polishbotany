<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16261d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Botany">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json?v=36"><!-- ?v= = the app build/ship version (Plate-style ship-counter). BUMP per code deploy; the More-tab badge reads it so it can't drift. -->

<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316261d'/%3E%3Cpath d='M16 6 C10 11 10 21 16 26 C22 21 22 11 16 6 Z' fill='none' stroke='%2362c177' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M16 9 L16 24' stroke='%2362c177' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<title>Botany</title>
<style>
  :root{
    /* ── forest / woodland — chrome (LIGHTENED: softer mid-forest cards, dropped the harsh near-black greens) ── */
    --bg:#16261d; --bg2:#1e3327; --panel:#213a2c; --panel2:#294835;
    --line:#3b6249; --line2:#4f8463;
    --ink:#eef4ea; --ink2:#b3c8b7; --ink3:#88a48e;
    --accent:#62c177; --good:#62c177; --warn:#d99a4e; --bad:#d9684f; --ghost:#7a977f;
    --bark:#6b4a2f; --bark2:#8a5e3a;
    /* ── lab colors re-tinted to natural hues (max hue-spread so charts stay readable) ── */
    --openai:#2e8b74; --anthropic:#c8744a; --google:#5b9ccb; --xai:#8f8a7e;
    --mistral:#cf6a2a; --qwen:#9159a0; --nvidia:#7a9e3c; --microsoft:#3f9fb0;
    --moonshot:#c25b86; --meta:#4f5aa8; --deepseek:#9072cc; --zhipu:#3bb39a;
    --mono:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Fraunces",Georgia,"Times New Roman",serif;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --navh:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#16261d}
  html,body{margin:0;padding:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  body{max-width:560px;margin:0 auto;min-height:100vh;position:relative;
    background:transparent;}
  /* soft light-sage watercolor texture — even & airy behind the cards */
  #forest{position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:url(img/bgtex-a.jpeg) center top/cover, #cfe3c2;}
  #pollen{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;opacity:.55}
  ::selection{background:rgba(98,193,119,.28);color:#fff}
  a{color:#8fd6a0;text-decoration:none}

  header.bar{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
    background:linear-gradient(180deg,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}   /* wordmark only — the tagline lives on the splash */
  .bar .row{display:flex;align-items:center;gap:11px;width:100%}
  .logo{width:30px;height:30px;flex:none}
  .bar h1{font-family:var(--display);font-size:23.8px;font-weight:600;letter-spacing:0;margin:0;line-height:1.02;color:var(--ink)}
  .bar .brand{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}

  main{padding:14px 14px calc(var(--navh) + env(safe-area-inset-bottom) + 22px)}
  .view{display:none;animation:fade .2s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .vh{font:700 15.0px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#27492f;margin:4px 0 4px}   /* deep forest: sits bare on the light sage bg */

  /* segmented switch: Closed ↔ Open weights (and the Timeline's All / Frontier / Open release filter) */
  .seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px;max-width:100%}
  .seg button{border:none;background:none;color:var(--ink3);font:650 15.6px var(--sans);padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.12s}
  .seg button.on{background:var(--panel2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .seg button[data-mode="open"].on{color:#9fd9ad}

  /* model card */
  .badge{font:700 11.9px var(--mono);padding:2px 6px;border-radius:5px;letter-spacing:.03em}
  .b-live{background:rgba(52,211,153,.12);color:var(--good)} .b-pulled{background:rgba(240,109,109,.12);color:var(--bad)}
  .b-preview{background:rgba(245,185,69,.12);color:var(--warn)} .b-open{background:rgba(98,193,119,.13);color:var(--accent)}
  .b-historic,.b-superseded{background:rgba(154,163,178,.12);color:var(--ghost)}

  /* accordion */
  details.acc{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
  details.acc>summary{cursor:pointer;padding:13px 15px;font-weight:700;font-size:18.1px;display:flex;align-items:center;gap:9px;list-style:none}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary .tw{transition:.2s;color:var(--ink3);font-size:13.8px}
  details.acc[open]>summary .tw{transform:rotate(90deg)}
  details.acc>summary .ct{margin-left:auto;font:600 13.8px var(--mono);color:var(--ink3)}
  details.acc .body{padding:0 13px 14px}
  .accsub{font-size:14.4px;color:var(--ink3);margin:-2px 0 10px;line-height:1.45}

  /* charts */
  .svgchart{display:block;width:100%;height:auto;overflow:visible}
  .svgchart text{font-family:var(--mono);fill:var(--ink3)}
  .chartcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 12px 10px;margin-bottom:11px}
  .chartcard h4{margin:0 0 2px;font-size:16.9px;font-weight:700;color:var(--ink)}
  .chartcard .cd{font-size:13.8px;color:var(--ink3);margin-bottom:8px;line-height:1.4}
  .legend2{display:flex;flex-wrap:wrap;gap:9px 12px;margin-top:9px;font:600 12.5px var(--mono);color:var(--ink3)}
  .legend2 span{display:inline-flex;align-items:center;gap:5px}
  .legend2 .ld{width:9px;height:9px;border-radius:50%}
  .tdetail{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--lab,var(--accent));border-radius:9px;padding:10px 12px}
  .td-top{display:flex;align-items:baseline;gap:8px}
  .td-nm{font-size:16.9px;font-weight:700}
  .td-sc{margin-left:auto;font:700 17.5px var(--mono);color:var(--accent)}
  .td-meta{font:600 13.1px var(--mono);color:var(--ink3);margin-top:3px}
  .td-why{font-size:15.0px;color:var(--ink2);margin-top:6px;line-height:1.45}
  svg circle[data-bench]:active{r:6.5}
  .mktrow{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .mkt-top{display:flex;align-items:center;gap:8px}
  .mkt-plat{font:700 11.2px var(--mono);border:1px solid;border-radius:5px;padding:2px 6px;text-transform:uppercase}
  .mkt-q{font-size:15.0px;color:var(--ink2);margin-top:6px;line-height:1.4}
  .mkt-d{font:600 12.5px var(--mono);color:var(--ink3);margin-left:auto}
  .mkt-go{margin-left:6px;color:var(--ink3);font-size:13.8px}
  .mkt-fc2{font:600 15.6px var(--mono);color:var(--ink);margin-top:6px;line-height:1.45;word-break:break-word}
  .mkt-fc2.stale{color:var(--ink3)}                                   /* % older than 14 days (or never stamped): muted, no bar */
  .mkt-asof{font:600 11.5px var(--mono);letter-spacing:.02em;color:var(--ink3);margin-top:3px}
  .mktrow.lnk{cursor:pointer;transition:border-color .15s,background .15s}
  .mktrow.lnk:focus-visible{border-color:var(--ink3);background:var(--panel);outline:none}
  @media (hover:hover){.mktrow.lnk:hover{border-color:var(--ink3);background:var(--panel)}}
  .subacc{border-left:2px solid var(--line);margin:8px 0 8px 1px}
  .subacc>summary{cursor:pointer;padding:7px 9px;font-weight:680;font-size:15.6px;display:flex;align-items:center;gap:7px;list-style:none;color:var(--ink2)}
  .subacc>summary::-webkit-details-marker{display:none}
  .subacc>summary .tw{transition:.2s;color:var(--ink3);font-size:12.5px}
  .subacc[open]>summary .tw{transform:rotate(90deg)}
  .subacc>summary .ct{margin-left:auto;font:600 12.5px var(--mono);color:var(--ink3)}
  .subbody{padding:2px 0 4px 11px}
  .mktstory p{font-size:16.2px;color:var(--ink);line-height:1.64;margin:0 0 11px}
  .mktstory p:last-child{margin-bottom:0}
  .mktstory p b{color:var(--accent);font-weight:700}
  .mktstory.clamp p:not(:first-child){display:none}                  /* opens on paragraph one; "Read more" shows the rest */
  .mktstory.clamp p:first-child{margin-bottom:0}
  .mktgrp-h{display:flex;align-items:center;font:700 13.1px var(--mono);letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin:15px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .mktgrp-h .ct{margin-left:auto;font-weight:600;color:var(--ink3)}
  .chartkey{font-size:13.1px;color:var(--ink3);margin-top:5px;line-height:1.4}
  .td-src{font-size:13.1px;color:var(--ink3);margin-top:6px;line-height:1.4}
  .newsrow{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px}
  .newsrow.lnk{cursor:pointer;transition:border-color .15s,background .15s}
  .newsrow.lnk:focus-visible{border-color:var(--ink3);background:var(--panel);outline:none}
  @media (hover:hover){.newsrow.lnk:hover{border-color:var(--ink3);background:var(--panel)}}
  .news-top{display:flex;align-items:center;gap:8px}
  .news-src{font:700 11.2px var(--mono);border:1px solid;border-radius:5px;padding:2px 6px;text-transform:uppercase;letter-spacing:.3px}
  .news-topic{font:600 11.9px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
  .news-date{margin-left:auto;font:600 12.5px var(--mono);color:var(--ink3)}
  .news-title{font-size:16.9px;font-weight:680;color:var(--ink);margin-top:8px;line-height:1.38}
  .news-blurb{font-size:15.0px;color:var(--ink2);margin-top:5px;line-height:1.5}
  /* predict — Timeline hero + release sheet */
  .phero{background:linear-gradient(135deg,color-mix(in srgb,var(--lab) 22%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--lab) 40%,var(--line));border-radius:13px;padding:13px 15px;margin-bottom:12px}
  .phero-k{font:700 12.5px var(--mono);letter-spacing:.5px;text-transform:uppercase;color:var(--lab)}
  .phero-m{font-size:23.8px;font-weight:700;color:var(--ink);margin-top:4px;display:flex;align-items:center;gap:8px}
  .phero-w{font-size:16.2px;color:var(--ink2);margin-top:3px}
  .phero-w b{color:var(--ink)}
  .rel-dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
  .fr-tag{font:700 10.0px var(--mono);letter-spacing:.4px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:4px;padding:1px 5px}
  .rel-noprob{font:600 13.1px var(--mono);color:var(--ink3);margin-top:6px}
  .pbar{position:relative;height:16px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;margin-top:7px;overflow:hidden}
  .pbar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px 0 0 8px;opacity:.5}
  .pbar-n{position:absolute;right:7px;top:0;line-height:16px;font:700 12.5px var(--mono);color:var(--ink)}
  .mkt-bar{height:5px;background:var(--bg);border-radius:3px;margin-top:8px;overflow:hidden}
  .mkt-bar-fill{height:100%;border-radius:3px;opacity:.72}
  /* glossary search (More) */
  .gsearch{width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:500 17.5px var(--sans);padding:10px 12px;margin-bottom:10px;outline:none}
  .gsearch:focus{border-color:var(--accent)}
  .gsearch::placeholder{color:var(--ink3)}
  .gterm{padding:10px 0;border-bottom:1px solid var(--line)}
  .gt-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .gt-term{font-size:16.9px;font-weight:700;color:var(--ink)}
  .gt-acr{font:700 12.5px var(--mono);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:4px;padding:1px 5px}
  .gt-cat{margin-left:auto;font:600 11.9px var(--mono);color:var(--ink3)}
  .gt-def{font-size:15.0px;color:var(--ink2);margin-top:4px;line-height:1.5}
  /* model info button + popup */
  .infobtn{display:inline-flex;align-items:center;gap:5px;margin-top:9px;background:var(--bg2);border:1px solid var(--line);color:var(--ink2);font:600 14.4px var(--sans);border-radius:8px;padding:5px 10px;cursor:pointer;transition:border-color .15s,color .15s}
  @media (hover:hover){.infobtn:hover{border-color:var(--accent);color:var(--ink)}}
  .infobtn svg{color:var(--accent)}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .modal[hidden]{display:none}
  .modal-bg{position:absolute;inset:0;background:rgba(4,6,11,.66);backdrop-filter:blur(2px);cursor:pointer}   /* cursor:pointer = iOS Safari delivers the tap-to-close click */
  .modal-card{position:relative;z-index:1;width:100%;max-width:540px;max-height:86vh;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.5);animation:sheet .22s ease}
  @keyframes sheet{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
  .modal-x{position:absolute;top:13px;right:13px;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);color:var(--ink2);font-size:17.5px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mi-nm{font-size:23.8px;font-weight:700;color:var(--ink);padding-right:34px;line-height:1.25}
  .mi-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:15.0px;color:var(--ink2);margin-top:7px}
  .mi-meta .dot{width:8px;height:8px;border-radius:50%}
  .mi-brief{margin-top:12px}
  .mi-brief p{font-size:16.9px;color:var(--ink);line-height:1.62;margin:0 0 11px}
  .mi-brief p:last-child{margin-bottom:0}
  /* tie popup — list of all tied models */
  .tiemodal-list{margin-top:14px}
  .tierow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tierow:last-child{border-bottom:none}
  .tierow .tdot{width:9px;height:9px;border-radius:50%;flex:none}
  .tierow .tnm{font-size:16.9px;font-weight:650;color:var(--ink)}
  .tierow .tlab{margin-left:auto;font:600 13.8px var(--mono);color:var(--ink3)}

  /* leaderboard */
  .lbrow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
  .lbrow.gold{border-color:rgba(245,185,69,.4);background:linear-gradient(100deg,rgba(245,185,69,.07),var(--bg2)),var(--bg2)}
  .lbrank{font:700 23.8px var(--mono);color:var(--ink3);text-align:center}
  .lbrow.gold .lbrank{color:var(--warn)}
  .lbname{font-weight:700;font-size:17.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .lbsub{font:600 13.1px var(--mono);color:var(--ink3);margin-top:2px}
  .lbscore{text-align:right;font:700 22.5px var(--mono);color:var(--ink)}
  .lb-unscored{font-size:13.1px;line-height:1.45;color:#456a4d;margin:2px 3px 0}   /* bare on the sage bg */

  /* release status pills (release sheet) */
  .hpill{font:700 11.2px var(--mono);padding:2px 6px;border-radius:5px}
  .h-soon{background:rgba(98,193,119,.14);color:#9fd9ad}
  .h-rum{background:rgba(154,163,178,.1);color:var(--ghost)}
  .srclist{padding-top:3px!important}
  .srcrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14.4px;cursor:pointer}
  .srcrow:first-child{border-top:none}
  .srcu{flex:1;color:#8fd6a0;word-break:break-all}
  @media (hover:hover){.srcrow:hover .srcu{text-decoration:underline}}

  .empty{text-align:center;color:#456a4d;font-size:15.6px;padding:24px 10px}   /* bare on the sage bg … */
  .ftab-panel .empty,.chartcard .empty,.modal-card .empty{color:var(--ink3)}  /* … but light ink inside the dark panels */

  nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:30;
    display:flex;background:rgba(28,46,35,.93);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);height:calc(var(--navh) + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:none;color:var(--ink3);font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:8px 1px;transition:color .15s}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button span{font-size:11.0px;font-weight:650;letter-spacing:-.1px}

  /* home */
  .hero{font-size:16.2px;color:var(--ink2);line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:13px}
  .hero b{color:var(--ink)}
  .hsec{font:700 13.8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#375a43;margin:20px 0 10px}
  .bestgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bestcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;border-left:3px solid var(--lab,var(--accent))}
  .bclabel{font:600 13.1px var(--sans);color:var(--ink3)}
  .bcname{font-size:16.9px;font-weight:700;margin-top:3px;line-height:1.2}
  .bcval{font:700 14.4px var(--mono);color:var(--accent);margin-top:4px}
  .tiecard{cursor:pointer}
  .tiechev{color:var(--ink3);display:inline-block;transition:transform .2s;font-weight:700}

  /* ════════════════ FOREST / WOODLAND @ DUSK — restrained reskin (overrides above) ════════════════ */
  /* soft & rounded, warm-bordered cards with a gentle drop shadow (cozier than the original) */
  .chartcard,details.acc,.phero,.lbrow,.mktrow,.newsrow,
  .bestcard,.modal-card,.tdetail{border-radius:16px}
  .chartcard,details.acc,.lbrow{box-shadow:0 2px 12px rgba(0,0,0,.26);border-color:var(--line)}
  @media (hover:hover){.lbrow:hover{box-shadow:0 4px 18px rgba(0,0,0,.34)}}
  .infobtn,.gsearch,.seg,.badge,.hpill,.pbar,.mkt-bar{border-radius:10px}
  /* topographic contour backdrop behind charts (faint concentric rings = elevation map) */
  .chartcard{background-image:
    repeating-radial-gradient(circle at 22% 118%,rgba(98,193,119,.055) 0 1px,transparent 1px 18px),
    repeating-radial-gradient(circle at 86% -12%,rgba(143,182,143,.04) 0 1px,transparent 1px 22px);}
  #v-home .hero{margin-top:54px}   /* a band above the overview for the fox to walk on (keeps it clear of the OVERVIEW words) */
  /* the Closed/Open toggle sits down near the leaderboard, away from the Pulse hero */
  #v-home .seg{margin-top:22px;margin-bottom:0}
  #v-home .seg + .hsec{margin-top:5px}
  /* ── living pixel fox: ambles along the TOP EDGE of the overview, sits at random ── */
  #fox{position:absolute;z-index:16;pointer-events:none;will-change:left,top;transition:opacity .3s ease}
  #fox.fox-off{opacity:0}
  .fox-img{display:block;height:77px;width:auto;image-rendering:pixelated;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}   /* Elthen pixel-art fox (32x32 cells): crisp chunky upscale, not smoothed */
  .fox-shadow{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);width:78%;height:6px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.4),transparent 72%)}
  /* ── file-cabinet sub-tabs (Models / Charts / Predict / News): active tab is stitched to the panel ── */

<script>
const LABV = {OpenAI:'--openai',Anthropic:'--anthropic',Google:'--google','Google DeepMind':'--google',DeepMind:'--google',xAI:'--xai',Mistral:'--mistral','Mistral AI':'--mistral',Alibaba:'--qwen','Alibaba (Qwen)':'--qwen',Qwen:'--qwen',NVIDIA:'--nvidia',Microsoft:'--microsoft','Microsoft + NVIDIA':'--microsoft',Moonshot:'--moonshot','Moonshot AI':'--moonshot',Meta:'--meta','Meta AI':'--meta','Meta Superintelligence Labs':'--meta',DeepSeek:'--deepseek',Zhipu:'--zhipu','Z.ai':'--zhipu','Zhipu / Z.ai':'--zhipu','Zhipu AI':'--zhipu'};
function labVar(l){ l=l==null?'':String(l); if(LABV[l]) return LABV[l]; const k=Object.keys(LABV).find(x=>l&&l.includes(x.split(' ')[0])); return k?LABV[k]:'--ghost'; }
const CANON={'--openai':'OpenAI','--anthropic':'Anthropic','--google':'Google','--xai':'xAI','--mistral':'Mistral','--qwen':'Alibaba','--nvidia':'NVIDIA','--microsoft':'Microsoft','--moonshot':'Moonshot','--meta':'Meta','--deepseek':'DeepSeek','--zhipu':'Zhipu'};
function canonLab(l){ return CANON[labVar(l)] || (l==null?'':String(l)); }
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// lab colour = the lab's CSS var; a lab without one gets a stable hash-hued colour (fixed S/L tuned for the dark cards) so
// unknown labs (Multiverse, Apodex, Celeris…) stop collapsing into one shared gray. The hash picks from the hue slots at
// least 14° away from every named lab's hue (read from those CSS vars), so it never lands on e.g. DeepSeek's purple and
// unknown labs spread evenly over what's left of the wheel. Memoized.
const LABHEX=new Map(); let LAB_FREE=null;
function hexHue(x){ const m=/^#([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(x||''); if(!m) return null;
  const [r,g,b]=[m[1],m[2],m[3]].map(v=>parseInt(v,16)/255), mx=Math.max(r,g,b), d=mx-Math.min(r,g,b); if(d<.08) return null;   // grays have no hue
  return (((mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4)*60)+360)%360; }
function labHex(l){ l=l==null?'':String(l); if(LABHEX.has(l)) return LABHEX.get(l);
  const v=labVar(l); let c=v==='--ghost'?'':css(v);
  if(!c){ if(!l) c=css('--ghost')||'#7a977f'; else {
    if(!LAB_FREE){ const named=[...new Set(Object.values(LABV))].map(k=>hexHue(css(k))).filter(h=>h!=null);
      LAB_FREE=[]; for(let h=0;h<360;h+=5) if(!named.some(k=>Math.min(Math.abs(k-h),360-Math.abs(k-h))<14)) LAB_FREE.push(h);
      if(!LAB_FREE.length) for(let h=0;h<360;h+=5) LAB_FREE.push(h); }
    let h=0; for(const ch of l) h=(h*31+ch.codePointAt(0))>>>0;
    c=`hsl(${LAB_FREE[h%LAB_FREE.length]},46%,60%)`; } }
  LABHEX.set(l,c); return c; }
// every data string that reaches innerHTML goes through he(): & < > " ' — Botany shares the polishcow31.github.io origin
// with Dawn's Kitchen, so a hostile string in the LLM-fed data must never become markup
const HE={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const he = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>HE[c]);
const fmtPulse = s => he(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');   // **bold** key facts, everything else escaped
const isHttp = u => /^https?:\/\//i.test(u==null?'':String(u));      // the only schemes a data-driven link may open
const nfmt = n => (Number(n)||0).toLocaleString('en-US');             // user-facing counts: 9,592 not 9592
const FAIL='<div class="empty">Couldn\'t load this section.</div>';
// render isolation: safe() wraps a whole view (a throw leaves one quiet line in THAT view, every other view still renders);
// guard() wraps a panel / chart body so one broken sub-tab never takes its tab strip down with it
function safe(fn,sel){ try{ fn(); return true; }catch(e){ console.error(e); const v=sel&&$(sel); if(v) v.innerHTML=FAIL; return false; } }
function guard(fn){ try{ return fn(); }catch(e){ console.error(e); return FAIL; } }

// ---- data: fetched by loadData(); every row normalized ONCE here so no renderer ever meets a null row, a number where it
// expects text, a string "true", or an array where it expects a string — the feed is rewritten by an LLM 8×/day ----
let DATA={models:[],meta:{}};
let PRICES={}, PRICENOTES={}, PULSE={}, SWEEPS=[], MARKETS=[], HISTORICS=[], FCSTORY=[], NEWS=[], GLOSSARY=[], RELEASES=[], BRIEFS={};
let GLOSS_READY=false, SWEEPS_READY=false;
const isObj = x => x!=null && typeof x==='object' && !Array.isArray(x);
const rows = x => (Array.isArray(x)?x:isObj(x)?Object.values(x):[]).filter(isObj);   // a list, or an {id:row} map → object rows only
const str = v => v==null||isObj(v)?'':Array.isArray(v)?v.filter(x=>x!=null&&!isObj(x)).join(', '):String(v);
const bool = v => v===true||v==='true';
const num = v => { const n=typeof v==='number'?v:parseFloat(v); return Number.isFinite(n)?n:null; };
function normModel(m){ const o=Object.assign({},m);
  ['name','lab','released','params','context','modality','notable','status'].forEach(k=>{ o[k]=str(m[k]).trim(); });
  o.status=o.status.toLowerCase(); o.open=bool(m.open);
  o.benchmarks={}; if(isObj(m.benchmarks)) Object.entries(m.benchmarks).forEach(([k,v])=>{ const n=num(v); if(n!=null) o.benchmarks[k]=n; else if(str(v).trim()) o.benchmarks[k]=str(v).trim(); });
  if(m.pricing!=null&&!isObj(m.pricing)) o.pricing=str(m.pricing);                    // {in,out} objects pass through — priceParts reads them
  return o; }
function normRelease(r){ const o=Object.assign({},r);
  ['model','lab','expectedDate','expectedWindow','status','basis','source'].forEach(k=>{ o[k]=str(r[k]).trim(); });
  o.status=o.status.toLowerCase(); o.prob=num(r.prob); o.frontier=bool(r.frontier);
  if(r.open==null||r.open==='') delete o.open; else o.open=bool(r.open);                   // absent ≠ false: isOpenRel only guesses when absent
  return o; }
function normMarket(k){ const o=Object.assign({},k);
  ['question','platform','forecast','category','resolveDate','url','asOf','kind'].forEach(f=>{ o[f]=str(k[f]).trim(); });
  o.category=o.category.toLowerCase(); o.kind=o.kind.toLowerCase(); return o; }
function normHist(h){ const o=Object.assign({},h);
  ['benchmark','model','lab','date','basis'].forEach(k=>{ o[k]=str(h[k]).trim(); });
  o.benchmark=o.benchmark.toLowerCase(); o.value=num(h.value);
  if(h.open==null||h.open==='') delete o.open; else o.open=bool(h.open);
  return o; }
function normNews(it){ const o=Object.assign({},it); ['title','source','url','date','topic','blurb'].forEach(k=>{ o[k]=str(it[k]).trim(); }); return o; }
function normTerm(t){ const o=Object.assign({},t); ['term','acronym','category','def'].forEach(k=>{ o[k]=str(t[k]).trim(); });
  o.aka=(Array.isArray(t.aka)?t.aka:(t.aka==null||t.aka==='')?[]:[t.aka]).map(str).filter(Boolean); return o; }
function normSweep(s){ return {date:str(s.date).trim().slice(0,10), routine:str(s.routine).trim(),
  sources:(Array.isArray(s.sources)?s.sources:[]).map(q=>isObj(q)?{u:str(q.u).trim(),url:str(q.url).trim()}:(typeof q==='string'&&q.trim())?{u:q.trim(),url:''}:null).filter(Boolean)}; }
// core files (everything Home / Models / Charts / Predict need) — a file that failed to load keeps the previous data
function applyCore(m,meta,ed,fc,rl){
  if(m) DATA.models=rows(m.models).map(normModel).filter(x=>x.name);
  if(meta) DATA.meta=isObj(meta)?meta:{};
  if(ed){ PRICES={}; if(isObj(ed.prices)) Object.entries(ed.prices).forEach(([k,v])=>{ PRICES[String(k).toLowerCase().trim()]=v; });
    PRICENOTES={}; if(isObj(ed.priceNotes)) Object.entries(ed.priceNotes).forEach(([k,v])=>{ const s=str(v).trim(); if(s) PRICENOTES[String(k).toLowerCase().trim()]=s; });
    PULSE=isObj(ed.pulse)?ed.pulse:{}; }
  if(fc){ MARKETS=rows(fc.markets).map(normMarket).filter(k=>k.question||k.forecast);
    HISTORICS=rows(fc.historics).map(normHist).filter(h=>h.value!=null&&h.date&&h.benchmark);
    FCSTORY=rows(fc.marketsStory).map(s=>({h:str(s.h).trim(),t:str(s.t).trim()})).filter(s=>s.t); }
  if(rl) RELEASES=rows(rl.items).map(normRelease).filter(r=>r.model);
  fitProEq();
}

// ---- boot: every fetch starts at once; the core views paint as soon as the small core files land, and news / glossary /
// sources fill in as they arrive (the 1.9 MB sources.json never gates first paint). no-cache = ETag revalidation. ----
const J = f => fetch('data/'+f+'.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error('data/'+f+'.json HTTP '+r.status); return r.json(); });
const DATA_FILES=['models','meta','editorial','forecasts','releases','briefs','news','glossary','sources'];
let lastLoad=0, LOADING=false;
async function loadData(first){
  LOADING=true;
  try{
    const P={}; DATA_FILES.forEach(f=>{ P[f]=J(f).catch(e=>(console.warn(f,e),null)); });   // each file fails soft to null
    const [m,meta,ed,fc,rl]=await Promise.all([P.models,P.meta,P.editorial,P.forecasts,P.releases]);
    applyCore(m,meta,ed,fc,rl); lastLoad=Date.now();
    renderCore();
    if(first){ safe(renderMore,'#v-more'); runSplash(); }
    await Promise.all([
      P.briefs.then(bf=>{ if(bf&&isObj(bf.briefs)){ BRIEFS={}; Object.entries(bf.briefs).forEach(([k,v])=>{ const s=str(v); if(s) BRIEFS[k]=s; }); } }),
      P.news.then(nw=>safe(()=>{ if(nw) NEWS=rows(nw.items).map(normNews).filter(i=>i.title); renderNews(); },'#v-news')),
      P.glossary.then(gl=>safe(()=>{ if(gl) GLOSSARY=rows(gl.terms).map(normTerm).filter(t=>t.term); if(gl||first) GLOSS_READY=true; refreshGloss(); },'#glossres')),
      P.sources.then(sj=>safe(()=>{ if(sj) SWEEPS=rows(sj.sweeps).map(normSweep).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s.date)); if(sj||first) SWEEPS_READY=true; refreshSources(); },'#src-tree')),
    ]);
  } finally { LOADING=false; }
}
function renderCore(){ safe(renderHome,'#v-home'); safe(renderNow,'#v-now'); safe(renderCharts,'#v-charts'); safe(renderPredict,'#v-predict'); }
async function boot(){ await loadData(true); }
// iOS keeps a backgrounded PWA / tab alive for hours: coming back after >15 min reloads the data and re-renders (no splash)
const STALE_MS=15*60*1000;
function maybeRefresh(){ if(document.hidden||LOADING||!lastLoad||Date.now()-lastLoad<STALE_MS) return; loadData(false).catch(e=>console.error(e)); }
// ---- opening splash: branded loading screen (leaf + Botany + tagline + a fake loading bar) ----
function dismissSplash(){ const s=$('#splash'); if(s) s.classList.add('gone'); }
function runSplash(){
  const s=$('#splash'); if(!s) return;
  const bar=$('#sp-bar'); if(bar){ bar.classList.add('show'); requestAnimationFrame(()=>bar.classList.add('go')); }
  const t=setTimeout(dismissSplash, 1900);
  s.addEventListener('click',()=>{clearTimeout(t);dismissSplash();},{once:true});
}
setTimeout(()=>{try{dismissSplash();}catch(e){}}, 6000);   // hard backstop: never let the splash stick

// ---- dates: every formatter tolerates junk (numbers, full ISO timestamps, invalid dates) ----
function timeAgo(d){ if(!(d instanceof Date)||isNaN(d)) return '—'; const s=(Date.now()-d.getTime())/1000; if(s<3600)return Math.max(1,Math.round(s/60))+'m ago'; if(s<86400)return Math.round(s/3600)+'h ago'; return Math.round(s/86400)+'d ago'; }
const MM=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => { if(s==null||s==='') return ''; s=String(s).slice(0,10); const p=s.split('-'), y=p[0], mo=MM[+p[1]], d=+p[2];
  if(!/^\d{4}$/.test(y)) return s; return mo?(d?`${mo} ${d}, ${y}`:`${mo} ${y}`):y; };   // non-ISO text comes back as-is — callers he() it
function fmtDay(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso==null?'':iso)); if(!m||!MM[+m[2]]||!+m[3]) return '';   // "2026-09-30" → "Sep 30"; other years "Dec 31, 2027"
  return `${MM[+m[2]]} ${+m[3]}`+(+m[1]!==new Date().getFullYear()?`, ${m[1]}`:''); }
const pad2 = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };   // LOCAL date, not UTC (evening ET ≠ tomorrow)
const ISO_RE=/^(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?(?!\d)/;
function dayNum(s){ const m=ISO_RE.exec(String(s==null?'':s)); return m?Date.UTC(+m[1],(+m[2]||1)-1,+m[3]||1)/864e5:null; }
function tval(s){ const m=ISO_RE.exec(String(s==null?'':s)); return m?+m[1]+((+m[2]||1)-1)/12:NaN; }
function statusBadge(s){const m={live:'b-live',pulled:'b-pulled',preview:'b-preview',historic:'b-historic',superseded:'b-superseded'}[s];return m?`<span class="badge ${m}">${he(String(s).toUpperCase())}</span>`:'';}

// ---- benchmarks: ONE preferred key per category, never a max across keys (a max let "SWE-bench Multilingual" or some
// variant stand in for Verified). Canonical spelling first; both spellings match, so the pipeline's key canonicalization
// ("SWE-bench"→"SWE-bench Verified", "GPQA"→"GPQA Diamond") changes nothing here ----
const BENCH_PREF={
  aa:[/^aa[ -]?index$/i,/^(aa|artificial analysis)[ -]intelligence[ -]index$/i,/^intelligence index$/i],
  swe:[/^swe[ -]?bench verified$/i,/^swe[ -]?bench$/i],
  swepro:[/^swe[ -]?bench pro$/i],
  gpqa:[/^gpqa diamond$/i,/^gpqa$/i],
  aime:[/^aime 2026$/i,/^aime$/i],
};
function benchOf(m,cat){ const b=(m&&m.benchmarks)||{}, pref=BENCH_PREF[cat]; if(!pref) return null; const ks=Object.keys(b);
  for(const re of pref) for(const k of ks) if(re.test(k)){ const v=num(b[k]); if(v!=null) return v; }
  return null; }
// ---- CODING on ONE scale (owner decision, Sep 28 2026): SWE-bench Pro, with SWE-bench Verified crosswalked in.
// Fit at runtime over EVERY model that reports both, whatever its status (going superseded / historic doesn't invalidate
// a paired measurement): OLS on logits, logit(Pro) = a + b·logit(Verified); off below 6 pairs.
// ERA GUARD: the V→P relationship drifted (Pro-launch Sep 2025 models scored ~23% Pro at 70%+ Verified; today's pairs sit
// far higher), so a Verified-only score converts ONLY if released ≥ the earliest paired model's release (no buffer) AND
// V ≥ (lowest paired V − 5). Never extrapolate further. Native Pro always wins; the Details sheet keeps native scores. ----
const logit=p=>Math.log(p/(1-p)), unlogit=z=>100/(1+Math.exp(-z)), r1=v=>Math.round(v*10)/10;
let PROFIT=null;   // {n,a,b,s,r2,t0,vmin} — refit on every data load; null = conversion off
function fitProEq(){
  const pairs=DATA.models.map(m=>({V:benchOf(m,'swe'),P:benchOf(m,'swepro'),t:dayNum(m.released)}))
    .filter(o=>o.V>0&&o.V<100&&o.P>0&&o.P<100&&o.t!=null);
  const n=pairs.length; PROFIT=null;
  if(n<6){ console.info(`proEq: off — ${n} models report both SWE-bench Verified and Pro (need 6)`); return; }
  const xs=pairs.map(o=>logit(o.V/100)), ys=pairs.map(o=>logit(o.P/100)), mx=xs.reduce((s,x)=>s+x,0)/n, my=ys.reduce((s,y)=>s+y,0)/n;
  let sxx=0,sxy=0,syy=0; xs.forEach((x,i)=>{ sxx+=(x-mx)**2; sxy+=(x-mx)*(ys[i]-my); syy+=(ys[i]-my)**2; });
  if(!(sxx>0)) return;
  const b=sxy/sxx, a=my-b*mx, sse=xs.reduce((s,x,i)=>s+(ys[i]-(a+b*x))**2,0);
  PROFIT={n,a,b,s:Math.sqrt(sse/(n-2)),r2:syy>0?1-sse/syy:0,t0:Math.min(...pairs.map(o=>o.t)),vmin:Math.min(...pairs.map(o=>o.V))-5};
  console.info(`proEq: logit(Pro) = ${a.toFixed(3)} + ${b.toFixed(3)}·logit(Verified) · n=${n} · R² ${PROFIT.r2.toFixed(2)} · s=${PROFIT.s.toFixed(3)} · converts V ≥ ${PROFIT.vmin} released ≥ ${new Date(PROFIT.t0*864e5).toISOString().slice(0,10)}`);
}
function proFromVerified(V,released){ const F=PROFIT, t=dayNum(released); V=num(V);
  if(!F||V==null||!(V>0&&V<100)||t==null||t<F.t0||V<F.vmin) return null;                  // outside the era guard → no Pro-equivalent
  const z=F.a+F.b*logit(V/100), d=1.96*F.s;
  return {v:r1(unlogit(z)),est:true,lo:r1(unlogit(z-d)),hi:r1(unlogit(z+d)),from:V}; }
function proEq(m){ const p=benchOf(m,'swepro'); if(p!=null) return {v:p,est:false}; const V=benchOf(m,'swe'); return V==null?null:proFromVerified(V,m.released); }
function ctxNum(s){if(s==null)return 0;const m=String(s).match(/(\d[\d,]*(?:\.\d+)?)(?![\d.,])\s*([KM])?(?![A-Za-z])/i);if(!m)return 0;let v=+m[1].replace(/,/g,'');const u=(m[2]||'').toUpperCase();if(u==='K')v*=1e3;else if(u==='M')v*=1e6;return v;}
function fmtTokens(n){ if(!(n>0)) return '—'; const t=(v,u)=>String(+v.toFixed(v<10?2:v<100?1:0))+u; return (n>=1e6?t(n/1e6,'M'):n>=1e3?t(n/1e3,'K'):String(Math.round(n)))+' tokens'; }
// ---- prices: the EXACT editorial PRICES key (lower-cased name), else the model's own pricing field. No substring fallback —
// that's what handed the TTS models their LLM sibling's price ----
function priceFor(m){ if(!m) return null; const k=String(m.name||'').toLowerCase().trim(), p=Object.prototype.hasOwnProperty.call(PRICES,k)?PRICES[k]:null;
  if(p!=null&&p!=='') return p; return (m.pricing!=null&&m.pricing!=='')?m.pricing:null; }
// "4/20" · "$1.40 in / $4.40 out per 1M" · "0.44/1.32 peak, …" · {in,out} → {in,out} USD per 1M tokens. Per-second / per-minute /
// per-page / "open weights" prices → null, so callers show the raw text (never with a "$" prefix).
function priceParts(p){
  if(p==null) return null;
  if(isObj(p)){ const a=num(p.in), b=num(p.out); return (a!=null&&b!=null&&a>=0&&b>=0)?{in:a,out:b}:null; }
  const m=String(p).match(/^\s*\$?\s*(\d+(?:\.\d+)?)\s*(?:in\b)?\s*\/\s*\$?\s*(\d+(?:\.\d+)?)(?![\d.]|\s*[KM]\b)/i);
  return m?{in:+m[1],out:+m[2]}:null; }
function outPrice(m){ const pp=priceParts(priceFor(m)); return pp?pp.out:null; }
const fmtUSD = n => { if(!(n>=0)) return '—'; if(Number.isInteger(n)) return '$'+n; let s=n.toFixed(2); if(Math.abs(+s-n)>1e-9) s=String(+n.toFixed(4)); return '$'+s; };
// non-text models (TTS / voice / transcription / image / video / music / robotics) never win an LLM category and never pad
// the "not yet scored" line: name hints, a transcription / voice modality, a "-to-image/video/music" generator, or output
// clauses ("… out") none of which is text
const NONTEXT_NAME=/\b(TTS|transcribe|voice|image|video|flux|diffusion)\b/i;
function isTextModel(m){
  if(NONTEXT_NAME.test(m.name||'')) return false;
  const mo=String(m.modality||'').toLowerCase();
  if(/speech recognition|transcri|text-to-speech|full-duplex|real-time voice/.test(mo)) return false;
  if(/\b(image|video|music|audio|speech) generation\b|-to-(image|video|music|speech|audio)\b/.test(mo)) return false;
  const outs=mo.match(/[^;,()]*\bout\b/g);
  return !(outs&&!outs.some(c=>/\btext\b/.test(c)));
}

// ---------------- HOME ----------------
let homeMode='frontier';
function segCtl(seg,mode,opts){return `<div class="seg" data-seg="${seg}">${opts.map(o=>`<button data-mode="${o[0]}" class="${mode===o[0]?'on':''}">${he(o[1])}</button>`).join('')}</div>`;}
const FO=[['frontier','Closed'],['open','Open']];   // weights-openness toggle: labels only — the internal mode values stay 'frontier'/'open'
const USECASES=[{label:'Top overall',cat:'aa',suf:''},{label:'Coding · SWE Pro',cat:'coding'},{label:'Science · GPQA',cat:'gpqa',suf:'%'},{label:'Math · AIME',cat:'aime',suf:'%'},{label:'Longest context',cat:'context'},{label:'Best value',cat:'value'}];
const byRecent=(a,b)=>String(b.released).localeCompare(String(a.released));
function pickBest(cands,uc){
  if(uc.cat==='context'){
    let bv=0; cands.forEach(m=>{const v=ctxNum(m.context); if(v>bv)bv=v;});
    if(!bv)return null;
    const models=cands.filter(m=>ctxNum(m.context)===bv).sort(byRecent);
    return {models, disp:fmtTokens(bv)};                                                    // from the NUMBER ("1.05M tokens"), never the raw string
  }
  if(uc.cat==='value'){
    const sc=m=>{const aa=benchOf(m,'aa'),p=outPrice(m); return (aa!=null&&p>0)?aa/p:null;};
    let bs=-1; cands.forEach(m=>{const s=sc(m); if(s!=null&&s>bs)bs=s;});
    if(bs<0)return null;
    const models=cands.filter(m=>{const s=sc(m); return s!=null&&Math.abs(s-bs)<1e-9;}).sort(byRecent);
    return {models, disp:fmtUSD(outPrice(models[0]))+' per 1M tokens'};
  }
  if(uc.cat==='coding'){                                                                     // Pro scale via proEq; on ties native beats estimated
    const q=new Map(); let bv=-1; cands.forEach(m=>{const p=proEq(m); if(p){q.set(m,p); if(p.v>bv)bv=p.v;}});
    if(bv<0)return null;
    let models=cands.filter(m=>q.has(m)&&q.get(m).v===bv); if(models.some(m=>!q.get(m).est)) models=models.filter(m=>!q.get(m).est);
    models.sort(byRecent);
    return {models, disp:(q.get(models[0]).est?'~':'')+bv+'%'};
  }
  let bv=-1; cands.forEach(m=>{const v=benchOf(m,uc.cat); if(v!=null&&v>bv)bv=v;});
  if(bv<0)return null;
  const models=cands.filter(m=>benchOf(m,uc.cat)===bv).sort(byRecent);
  return {models, disp:bv+(uc.suf||'')};
}
let TIEMAP={};
function bestCard(o){
  const ms=o.p.models, tie=ms.length>1;
  if(!tie){ const m=ms[0]; return `<div class="bestcard" style="--lab:${labHex(m.lab)}"><div class="bclabel">${he(o.uc.label)}</div><div class="bcname">${he(m.name)}</div><div class="bcval">${he(o.p.disp)}</div></div>`; }
  TIEMAP[o.uc.label]={label:o.uc.label, disp:o.p.disp, models:ms};
  return `<div class="bestcard tiecard" style="--lab:var(--accent)" data-tie="${he(o.uc.label)}" role="button" tabindex="0"><div class="bclabel">${he(o.uc.label)}</div><div class="bcname">${ms.length}-way tie <span class="tiechev">›</span></div><div class="bcval">${he(o.p.disp)}</div></div>`;
}
function tieInfo(t){
  const rows=t.models.map(m=>`<div class="tierow"><span class="tdot" style="background:${labHex(m.lab)}"></span><span class="tnm">${he(m.name)}</span><span class="tlab">${he(m.lab)}</span></div>`).join('');
  return `<button class="modal-x" aria-label="Close">✕</button>
    <div class="mi-nm">${he(t.label)}</div>
    <div class="mi-meta"><b>${t.models.length}-way tie</b> · <span style="color:var(--accent)">${he(t.disp)}</span></div>
    <div class="tiemodal-list">${rows}</div>`;
}
function renderHome(){
  const meta=DATA.meta||{};
  const ago=meta.lastUpdated?timeAgo(new Date(meta.lastUpdated)):'—', updAgo=ago==='—'?'':ago;
  let cands=DATA.models.filter(x=>x.status==='live');
  cands=cands.filter(x=> homeMode==='open'?x.open:!x.open);
  const lb=cands.map(x=>({x,aa:benchOf(x,'aa')})).filter(o=>o.aa!=null).sort((a,b)=>b.aa-a.aa).slice(0,5);
  const texts=cands.filter(isTextModel);                                                     // a TTS / image / video model never wins an LLM category
  const picks=USECASES.map(uc=>({uc,p:pickBest(texts,uc)})).filter(o=>o.p);
  const unscored=texts.filter(m=>benchOf(m,'aa')==null).sort(byRecent);                     // live text models AA hasn't scored yet
  TIEMAP={};   // rebuilt as bestCard() renders each tie
  const top=lb[0];
  const pulseTxt = (PULSE&&PULSE.text)?str(PULSE.text):'';
  const heroHTML = pulseTxt
    ? `<div class="hero pulse"><div class="pulse-txt clamp" data-clamp>${fmtPulse(pulseTxt)}</div><button class="pulse-more" data-pulse-toggle aria-expanded="false"><span class="pm-label">Read more</span><span class="pm-caret">▼</span></button></div>`
    : `<div class="hero"><b>${cands.length}</b> ${homeMode==='open'?'open':'closed'} models available right now. The leader sits at <b>${top?he(top.aa)+' AA-Index':'—'}</b>${top?' ('+he(top.x.name)+')':''}.${updAgo?' Updated '+updAgo+'.':''}</div>`;
  $('#v-home').innerHTML=`<div class="vh">Overview${updAgo?`<span class="vh-upd"> · updated ${updAgo}</span>`:''}</div>
    ${heroHTML}
    ${segCtl('home',homeMode,FO)}
    <div class="hsec">Leaderboard · AA Index${meta.aaScale?' '+he(meta.aaScale):''}</div>
    ${lb.length?lb.map((o,i)=>`<div class="lbrow ${i===0?'gold':''}"><div class="lbrank">${i+1}</div><div><div class="lbname"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${labHex(o.x.lab)}"></span>${he(o.x.name)}${o.x.open?' <span class="badge b-open" style="font-size:10.0px;padding:1px 4px">OPEN</span>':''}</div><div class="lbsub">${he(o.x.lab)}</div></div><div class="lbscore">${he(o.aa)}</div></div>`).join(''):'<div class="empty">No scores yet.</div>'}
    ${unscored.length?`<div class="lb-unscored">Not yet scored on AA: ${he(unscored.slice(0,6).map(m=>m.name).join(', '))}${unscored.length>6?` +${unscored.length-6} more`:''}</div>`:''}
    <div class="hsec">Best model for…</div>
    <div class="bestgrid">${picks.map(bestCard).join('')||'<div class="empty">—</div>'}</div>`;
  // Pulse clamp: only offer "Read more" when the brief actually overflows 4 lines (measured only while Home is on screen)
  const ptx=$('#v-home .pulse-txt'), pmore=$('#v-home .pulse-more');
  if(ptx&&pmore&&ptx.clientHeight>0&&ptx.scrollHeight<=ptx.clientHeight+2){ ptx.classList.remove('clamp'); pmore.hidden=true; }
}

// ---------------- MODELS (nav "Models"; internal view id stays "now") ----------------
function modelCard(m){
  // a clean name-first list; the full breakdown (specs, all benchmarks, brief) lives in the Details sheet (modelInfo)

function synthBrief(m){
  const b=m.benchmarks||{}, pp=priceParts(priceFor(m)), bits=[];
  bits.push(`${m.name} is ${m.open?'an open-weight':'a'} ${m.modality?String(m.modality).split(',')[0].trim()+' ':''}model from ${m.lab}${m.released?`, released ${fmtDate(m.released)}`:''}.`);
  const bench=Object.entries(b).slice(0,4).map(([k,v])=>`${k.replace(/\s*\(.*\)/,'')} ${v}`);
  if(bench.length) bits.push(`Reported scores include ${bench.join(', ')}.`);
  const tail=[];
  if(m.params&&m.params!=='—') tail.push(`${m.params} parameters`);
  if(m.context&&m.context!=='—') tail.push(`a ${m.context} context window`);
  if(pp) tail.push(`pricing of ${fmtUSD(pp.in)} in and ${fmtUSD(pp.out)} out per million tokens`);
  if(tail.length) bits.push(`It has ${tail.join(', ')}.`);
  if(m.notable) bits.push(m.notable);
  return bits.join(' ');
}

const PCT_BENCH=/^(swe|gpqa|aime|hle|mmlu|osworld|arc-agi|terminal-bench)/i;
const benchIsPct=(k,v)=>typeof v==='number'&&v>=0&&v<=100&&!/\belo\b|index|\baa\b|-aa\b|\baa-/i.test(k)&&(PCT_BENCH.test(k)||/\b(verified|pro|diamond)\b/i.test(k)||/\(%\)/.test(k));

  // editorial.priceNotes[name] (tiers / promos / cache rates the pipeline splits off the "in/out" price) → one muted line

  const rawPr=(pr!=null&&!isObj(pr))?String(pr).trim():'', note=PRICENOTES[String(m.name||'').toLowerCase().trim()]||'';
  const showNote=!!note&&!(!pp&&rawPr.toLowerCase()===note.toLowerCase());

  return `<button class="modal-x" aria-label="Close">✕</button>
    <div class="mi-nm">${he(m.name)}</div>
    <div class="mi-meta"><span class="dot" style="background:${labHex(m.lab)}"></span>${he(m.lab)} · ${he(fmtDate(m.released))} ${m.status!=='live'?statusBadge(m.status):''}${m.open?' <span class="badge b-open">OPEN</span>':''}</div>

const tick = v => String(Math.round(v)||0);                       // axis labels: whole numbers, never "-0"

// releases per quarter, zero-filled from the first quarter to the last COMPLETE one (the in-progress quarter is excluded —
// a partial quarter always reads as a slowdown), with a trailing 4-quarter (12-month) average line
function cadenceLine(){
  const C={line:css('--line'),ink3:css('--ink3'),accent:css('--accent')};
  const now=new Date(), curQ=now.getFullYear()*4+Math.floor(now.getMonth()/3), bins={};
  DATA.models.filter(m=> cadenceMode==='open'?m.open:!m.open).forEach(m=>{
    const r=/^(\d{4})-(\d{2})/.exec(m.released||''); if(!r||+r[2]<1||+r[2]>12) return;      // year-only dates can't be placed in a quarter
    const q=+r[1]*4+Math.floor((+r[2]-1)/3); if(q>=curQ) return; bins[q]=(bins[q]||0)+1; });
  const ks=Object.keys(bins).map(Number); if(!ks.length) return '<div class="empty">Not enough data.</div>';
  const pts=[]; for(let q=Math.min(...ks);q<curQ;q++) pts.push({q,c:bins[q]||0});
  if(pts.length<4) return '<div class="empty">Not enough data.</div>';
  const roll=pts.slice(3).map((p,i)=>({q:p.q,v:(pts[i].c+pts[i+1].c+pts[i+2].c+pts[i+3].c)/4}));
  const x0=pts[0].q/4, x1=(pts[pts.length-1].q+1)/4, y1=(Math.max(...pts.map(p=>p.c),...roll.map(p=>p.v))||1)*1.12;
  const W=500,H=200,L=30,R=12,T=12,B=26;
  const X=t=>L+((t-x0)/(x1-x0))*(W-L-R),Y=v=>T+(1-v/y1)*(H-T-B);
  let s=`<svg class="svgchart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  for(let i=0;i<=3;i++){const yy=y1*i/3,py=Y(yy).toFixed(1);s+=`<line x1="${L}" y1="${py}" x2="${W-R}" y2="${py}" stroke="${C.line}" opacity=".5"/><text x="${L-4}" y="${(+py+4).toFixed(1)}" font-size="11" text-anchor="end" fill="${C.ink3}">${tick(yy)}</text>`;}
  const yrs=[]; for(let y=Math.ceil(x0);y<=Math.floor(x1);y++) yrs.push(y); const every=Math.max(1,Math.ceil(yrs.length/7));   // ≤7 year labels so they never collide
  yrs.forEach((y,i)=>{ if(i%every===0) s+=`<text x="${X(y).toFixed(1)}" y="${H-6}" font-size="11" text-anchor="middle" fill="${C.ink3}">${y}</text>`; });
  if(roll.length>1) s+=`<polyline points="${roll.map(p=>`${X(p.q/4).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="${C.accent}" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(p=>s+=`<circle cx="${X(p.q/4).toFixed(1)}" cy="${Y(p.c).toFixed(1)}" r="2.4" fill="${C.ink3}"><title>${p.c} that quarter</title></circle>`);
  return s+'</svg><div class="accsub" style="margin-top:8px">Dots = models tracked per quarter · line = 12-month average.</div>';
}

const HH_METRICS=[['aa','Overall'],['coding','Coding'],['gpqa','Science'],['aime','Math']];
function hhVal(m,cat){ if(cat==='coding') return proEq(m); const v=benchOf(m,cat); return v==null?null:{v,est:false}; }
function niceMax(v,pct){ if(!(v>0)) return pct?100:10; const step=v<=10?2:v<=50?5:10, n=Math.ceil(v/step)*step; return pct?Math.min(100,n):n; }
// chart label: never cut mid-version — drop a leading word that repeats the lab ("Meta Muse Spark 1.3" → "Muse Spark 1.3"),
// then cut at a space / hyphen boundary + "…"
function hhLabel(m){
  let s=String(m.name||'').replace(/\s*\(.*\)/,'').trim(); if(s.length<=17) return s;
  const w=s.split(/\s+/), lab=canonLab(m.lab).split(/\s+/)[0].toLowerCase();
  if(w.length>1&&w[0].toLowerCase()===lab) s=w.slice(1).join(' ');
  if(s.length<=17) return s;
  const cut=s.slice(0,17), at=Math.max(cut.lastIndexOf(' '),cut.lastIndexOf('-'));
  return (at>2?cut.slice(0,at):cut).replace(/[\s-]+$/,'')+'…';
}
function headToHead(){
  const cat=(HH_METRICS.find(x=>x[0]===hhMetric)||HH_METRICS[0])[0], pct=cat!=='aa';
  const seg=segCtl('hh',cat,HH_METRICS);
  const rows=DATA.models.filter(m=>m.status==='live').map(m=>({m,q:hhVal(m,cat)})).filter(o=>o.q)
    .sort((a,b)=>b.q.v-a.q.v||(a.q.est?1:0)-(b.q.est?1:0)).slice(0,8);
  if(!rows.length) return seg+'<div class="empty">No data for that metric.</div>';
  const C={line:css('--line'),ink2:css('--ink2'),ink3:css('--ink3')};
  const hi=niceMax(Math.max(...rows.map(o=>o.q.v)),pct);                                     // axis max = nice-rounded data max (≤100 for %)
  const W=500,rh=31,top=6,L=134,R=54,bw=W-L-R,H=top+rows.length*rh+18;
  const X=v=>L+(Math.max(0,Math.min(v,hi))/hi)*bw;

  [0,.25,.5,.75,1].forEach(f=>{const x=(L+f*bw).toFixed(1);s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${top+rows.length*rh}" stroke="${C.line}" opacity=".4"/><text x="${x}" y="${H-3}" font-size="11" text-anchor="middle" fill="${C.ink3}">${tick(f*hi)}</text>`;});
  rows.forEach((o,i)=>{const y=top+i*rh+rh/2,col=labHex(o.m.lab),bx=X(o.q.v),val=(o.q.est?'~':'')+r1(o.q.v)+(pct?'%':'');
    s+=`<text x="${L-7}" y="${(y+4).toFixed(1)}" font-size="12" font-weight="600" text-anchor="end" fill="${C.ink2}" font-family="var(--sans)">${he(hhLabel(o.m))}</text>`;
    s+=`<rect x="${L}" y="${(y-8).toFixed(1)}" width="${Math.max(1,bx-L).toFixed(1)}" height="16" rx="3" fill="${col}"${o.q.est?' opacity=".6"':''}><title>${he(o.m.name)}: ${he(val)}</title></rect>`;
    s+=`<text x="${(bx+5).toFixed(1)}" y="${(y+4).toFixed(1)}" font-size="12" font-weight="700" fill="${C.ink2}" font-family="var(--mono)">${he(val)}</text>`;});
  s+='</svg>';
  return seg+s;
}

  if(mm.length){ const m=mm[mm.length-1], mi=TL_MO.indexOf(m[1].slice(0,3)), y=m[3]?+m[3]:fallbackY, day=m[2]?+m[2]:null;

// its Verified-scale history goes through the proEq conversion + era guard instead.)
function historicsUsable(cat){

  if(!hv.length) return false;
  if(cat==='aa' && HISTORICS.some(h=>h.benchmark==='aa' && h.scale!==(DATA.meta||{}).aaScale)) return false;
  let lmax=-Infinity; DATA.models.forEach(m=>{const v=benchOf(m,cat); if(v!=null&&v>lmax)lmax=v;});

const WINDOW_MONTHS=18;

function glossResults(q){
  if(!GLOSS_READY) return '';
  if(!GLOSSARY.length) return '<div class="empty">Nothing yet.</div>';
  if(!q) return '';                                   // terms aren't listed up front — you search to surface them
  const hits=GLOSSARY.filter(t=>glossMatch(t,q));
  if(!hits.length) return `<div class="empty">No term matches “${he(q)}”.</div>`;
  return `<div class="accsub" style="margin:0 0 8px">${nfmt(hits.length)} match${hits.length>1?'es':''}</div>` + hits.map(glossRow).join('');
}
const glossPlaceholder = () => GLOSSARY.length?`Search ${nfmt(GLOSSARY.length)} terms — MMLU, MoE, RLHF…`:'Search terms — MMLU, MoE, RLHF…';
function refreshGloss(){                                // glossary landed / reloaded: update in place so a half-typed search survives
  const q=$('#glossq'), r=$('#glossres'); if(q) q.setAttribute('placeholder',glossPlaceholder()); if(r) r.innerHTML=glossResults(q?String(q.value||'').trim():'');
}

// ---------------- MORE ▸ Sources (built on first open, never at boot: ~9.6k rows) ----------------
const SDOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function sParseD(s){ const p=(s||'').split('-').map(Number); return new Date(p[0]||2026,(p[1]||1)-1,p[2]||1); }
function sWeekKey(dateStr){ const d=sParseD(dateStr); d.setDate(d.getDate()-d.getDay()); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function sWeekLabel(k){ const a=sParseD(k), b=new Date(a); b.setDate(b.getDate()+6); return `${MM[a.getMonth()+1]} ${a.getDate()} – ${a.getMonth()===b.getMonth()?'':MM[b.getMonth()+1]+' '}${b.getDate()}`; }
function sDayLabel(dateStr){ const d=sParseD(dateStr); return `${SDOW[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`; }
function srcRow(s){ const raw=s.url||('https://'+String(s.u||'').replace(/\s*\(.*$/,'').split(/\s/)[0]), url=isHttp(raw)?raw:'';
  return `<div class="srcrow${url?' lnk':''}"${url?` data-href="${he(url)}"`:''}><span class="srcu">${he(s.u||raw)}</span>${url?ARROW:''}</div>`; }
const srcTotal = () => SWEEPS.reduce((n,s)=>n+s.sources.length,0);
let SRCWEEKS=null;   // [{key,n,days:[{date,n,sweeps}]}] — grouped when the drawer first opens
function srcWeeks(){
  if(SRCWEEKS) return SRCWEEKS;
  const RORD={'9PM':8,'6PM':7,'3PM':6,'12PM':5,'9AM':4,'6AM':3,'3AM':2,'12AM':1,'PM':6,'AM':2};   // newest-first within a day; legacy AM/PM still sort
  const rr=s=>RORD[s.routine]||0, weeks=[];
  [...SWEEPS].sort((a,b)=> b.date.localeCompare(a.date) || rr(b)-rr(a)).forEach(s=>{
    const wk=sWeekKey(s.date); let W=weeks.find(w=>w.key===wk); if(!W){W={key:wk,days:[],n:0};weeks.push(W);}
    let D=W.days.find(d=>d.date===s.date); if(!D){D={date:s.date,sweeps:[],n:0};W.days.push(D);}
    D.sweeps.push(s); D.n+=s.sources.length; W.n+=s.sources.length; });
  return (SRCWEEKS=weeks);
}
// each level is an empty <details>; its children are rendered the first time it opens (see the 'toggle' listener)
const srcAcc = (attr,label,n) => `<details class="subacc" ${attr}><summary>${CHEV}${he(label)}<span class="ct">${nfmt(n)}</span></summary><div class="subbody"></div></details>`;
function srcTreeHTML(){
  if(!SWEEPS_READY) return '<div class="empty">Loading…</div>';
  if(!SWEEPS.length) return '<div class="empty">Nothing yet.</div>';
  return srcWeeks().map((W,wi)=>srcAcc(`data-src-w="${wi}"`,sWeekLabel(W.key),W.n)).join('');
}
function srcFill(d){                                       // fill one lazily-built level of the tree
  const body=d.querySelector('.subbody'); if(!body||d.dataset.built) return; d.dataset.built='1';
  const W=srcWeeks(), a=(d.getAttribute('data-src-w')||d.getAttribute('data-src-d')||d.getAttribute('data-src-s')||'').split(':').map(Number);
  if(d.hasAttribute('data-src-w')){ const wk=W[a[0]]; if(wk) body.innerHTML=wk.days.map((D,di)=>srcAcc(`data-src-d="${a[0]}:${di}"`,sDayLabel(D.date),D.n)).join(''); }
  else if(d.hasAttribute('data-src-d')){ const D=W[a[0]]&&W[a[0]].days[a[1]]; if(D) body.innerHTML=D.sweeps.map((s,si)=>srcAcc(`data-src-s="${a[0]}:${a[1]}:${si}"`,s.routine||'Build',s.sources.length)).join(''); }
  else { const s=W[a[0]]&&W[a[0]].days[a[1]]&&W[a[0]].days[a[1]].sweeps[a[2]]; if(s){ body.classList.add('srclist'); body.innerHTML=s.sources.map(srcRow).join(''); } }
}
function refreshSources(){                                 // sources landed / reloaded: badge from the array length; the tree only if it's showing
  SRCWEEKS=null; const ct=$('#src-ct'); if(ct) ct.textContent=SWEEPS_READY?nfmt(srcTotal()):'…';
  const dr=$('details.more-sources'), tree=$('#src-tree'); if(tree&&dr&&dr.open) tree.innerHTML=srcTreeHTML(); else if(tree) tree.innerHTML='';
}
// build version badge — copied from Plate's setAppVersion: stamp it from a LOADED asset's ?v= so it
// can't drift from the deployed build. Botany is inline-only (no app.js), so it reads the versioned
// manifest link. Bump manifest.json?v=N per code deploy; blank if unreadable (never a wrong number).
// ── Web Push toggle (More tab). Subscriptions live in the botany-push Cloudflare Worker — GitHub Pages
// has no backend, so the PWA POSTs its subscription there (cross-origin). The worker's cron polls Botany's
// public data and pushes on a new model / breaking news / a new #1 on the AA Index. iOS: needs the PWA
// added to the home screen. ──
const PUSH_WORKER='https://botany-push.cozog02.workers.dev';
const VAPID_PUBLIC='BPhMKsm3XOHual5yDTBNRxxeQD32sOBaU8Ny-fSqGES5iWqjkEruW7L95XYJStjTJsRLp4JHJ-rEcOEGh4l4cHI';
function urlBase64ToUint8Array(b64){ const pad='='.repeat((4-b64.length%4)%4); const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(s); const a=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i); return a; }
const pushOK=()=>('serviceWorker'in navigator)&&('PushManager'in window)&&('Notification'in window);
// iOS only offers Web Push to a Home Screen app — in a Safari tab the honest label is the way in, not a dead end
const isIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>navigator.standalone===true||!!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
const IOS_TAB_NOTIF='Add to Home Screen for alerts';
function notifSet(t,on){ const b=document.getElementById('notif-toggle'); if(b){ b.textContent=t; b.classList.toggle('on',!!on); } }
async function notifState(){
  if(isIOS()&&!isStandalone()) return notifSet(IOS_TAB_NOTIF,false);
  if(!pushOK()) return notifSet('Notifications unavailable',false);
  if(Notification.permission==='denied') return notifSet('Notifications blocked',false);
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); notifSet(sub?'Notifications on':'Enable notifications',!!sub); }
  catch(e){ notifSet('Enable notifications',false); }
}
async function toggleNotif(){
  if(isIOS()&&!isStandalone()) return notifSet(IOS_TAB_NOTIF,false);
  if(!pushOK()) return notifSet('Notifications unavailable',false);
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(sub){                                    // currently on → turn OFF
    try{ await fetch(PUSH_WORKER+'/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}); }catch(e){}
    try{ await sub.unsubscribe(); }catch(e){}
    return notifSet('Enable notifications',false);
  }
  const perm=await Notification.requestPermission();
  if(perm!=='granted') return notifSet(perm==='denied'?'Notifications blocked':'Enable notifications',false);
  notifSet('Enabling…',false);
  try{
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});
    const r=await fetch(PUSH_WORKER+'/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(sub)});
    notifSet(r&&r.ok?'Notifications on':'Try again',!!(r&&r.ok));
  }catch(e){ notifSet('Try again',false); }
}
function setAppVersion(){
  var v='';
  try{ var s=document.querySelector('link[rel="manifest"]'); var m=s&&/[?&]v=(\d+)/.exec(s.getAttribute('href')||''); if(m) v='v'+m[1]; }catch(e){}
  var node=document.getElementById('app-ver'); if(node) node.textContent=v;
}
// More is rendered ONCE as a shell; glossary / sources fill it in place as they land (refreshGloss / refreshSources)
function renderMore(){
  $('#v-more').innerHTML = `<div class="vh">Glossary</div>
    <input id="glossq" class="gsearch" type="search" placeholder="${he(glossPlaceholder())}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="glossres" class="glist">${glossResults('')}</div>
    <details class="acc more-sources"><summary>${CHEV}Sources<span class="ct" id="src-ct">${SWEEPS_READY?nfmt(srcTotal()):'…'}</span></summary>
      <div class="body"><div id="src-tree"></div><div class="accsub" style="margin-top:12px">Fox sprite: <a href="https://elthen.itch.io/2d-pixel-art-fox-sprites" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Elthen's Pixel Art Shop</a> (free license).</div></div></details>
    <div class="more-foot">
      <button id="notif-toggle" class="notif-btn" type="button">Enable notifications</button>
      <div class="app-ver" id="app-ver" aria-hidden="true"></div>
    </div>`;
  setAppVersion();
  const nb=document.getElementById('notif-toggle'); if(nb) nb.addEventListener('click',toggleNotif); notifState();
}

// ---------------- events ----------------
function showView(v){
  $$('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v)); $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  window.scrollTo(0,0); document.dispatchEvent(new CustomEvent('botany:view',{detail:v}));   // the fox wakes its loop when Home returns
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;showView(b.dataset.v);});
document.addEventListener('click',e=>{
  const t=e.target; if(!t||!t.closest) return;
  const te=t.closest('[data-tie]'); if(te){openTieModal(TIEMAP[te.getAttribute('data-tie')]);return;}
  const lk=t.closest('.lnk[data-href]'); if(lk){const u=lk.getAttribute('data-href'); if(isHttp(u)) window.open(u,'_blank','noopener'); return;}
  const dot=t.closest('circle[data-bench]'); if(dot){const cat=dot.getAttribute('data-bench'),sel='#detail-'+cat;
    safe(()=>{const d=$(sel); if(!d) return; const hi=dot.getAttribute('data-hist');
      if(hi!=null){ const h=HISTORICS[+hi]; d.innerHTML=h?histDetailCard(h,cat):''; return; }
      const m=DATA.models.find(x=>x.name===dot.getAttribute('data-model')); d.innerHTML=m?trajDetailCard(m,cat):'';},sel); return;}
  const rib=t.closest('[data-rel-info]'); if(rib){openReleaseModal(rib.getAttribute('data-rel-info'));return;}
  const cmp=t.closest('[data-compare]'); if(cmp){openCompare();return;}
  const sg=t.closest('.seg button[data-mode]'); if(sg){const which=sg.closest('.seg').dataset.seg,mode=sg.dataset.mode;
    const part=(state,id,fn)=>{ state(); const w=$('#'+id); if(w) safe(()=>{w.innerHTML=fn();},'#'+id); else safe(renderCharts,'#v-charts'); };
    if(which==='home'){homeMode=mode;safe(renderHome,'#v-home');}
    else if(which==='traj-aa'||which==='traj-swe'){const c=which.slice(5); part(()=>{trajMode[c]=mode;},'traj-'+c+'-wrap',()=>trajWrap(c));}
    else if(which==='hh'){part(()=>{hhMetric=mode;},'hh-wrap',()=>guard(headToHead));}
    else if(which==='cadence'){part(()=>{cadenceMode=mode;},'cadence-wrap',cadenceBlock);}
    else if(which==='radar'){radarFilter=mode;safe(renderPredict,'#v-predict');}
    return;}
  const ftb=t.closest('.ftab'); if(ftb){ const i=ftb.dataset.ftab.indexOf(':'),v=ftb.dataset.ftab.slice(0,i),val=ftb.dataset.ftab.slice(i+1);
    if(v==='now'){nowCat=val;safe(renderNow,'#v-now');} else if(v==='charts'){chartsTab=val;safe(renderCharts,'#v-charts');}
    else if(v==='predict'){predictTab=val;safe(renderPredict,'#v-predict');} else if(v==='news'){newsTopic=(val==='all'?null:val);safe(renderNews,'#v-news');}
    return; }
  const pm=t.closest('[data-pulse-toggle]'); if(pm){ const tx=pm.parentElement&&pm.parentElement.querySelector('[data-clamp]'); if(tx){ const expanded=!tx.classList.toggle('clamp'); pm.setAttribute('aria-expanded',expanded?'true':'false'); const lab=pm.querySelector('.pm-label'); if(lab)lab.textContent=expanded?'Read less':'Read more'; } return; }
  const ib=t.closest('[data-info]'); if(ib){openModal(ib.getAttribute('data-info'));return;}
  if(t.closest('.modal-bg')||t.closest('.modal-x')){closeModal();return;}
});
// 'toggle' doesn't bubble — a capture-phase listener sees every <details> opening: the Sources drawer + its lazy levels
document.addEventListener('toggle',e=>{ const d=e.target; if(!d||!d.open||!d.matches) return;
  if(d.matches('details.more-sources')){ const tree=$('#src-tree'); if(tree&&!tree.firstChild) safe(()=>{tree.innerHTML=srcTreeHTML();},'#src-tree'); }
  else if(d.matches('[data-src-w],[data-src-d],[data-src-s]')) safe(()=>srcFill(d)); },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
// keyboard-activate the div-based buttons (model rows, tie cards): Enter/Space → click
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][tabindex]')){ e.preventDefault(); e.target.click(); } });

document.addEventListener('input',e=>{ if(e.target&&e.target.id==='glossq'){ safe(()=>{ const r=$('#glossres'); if(r) r.innerHTML=glossResults(e.target.value.trim()); },'#glossres'); } });
document.addEventListener('change',e=>{ if(e.target&&(e.target.id==='cmpA'||e.target.id==='cmpB')){ if(e.target.id==='cmpA')cmpA=e.target.value; else cmpB=e.target.value; safe(()=>{ const r=$('#cmp-result'); if(r) r.innerHTML=cmpResult(); },'#cmp-result'); } });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) maybeRefresh(); });
window.addEventListener('pageshow',e=>{ if(e.persisted) maybeRefresh(); });            // back-forward cache restore
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
boot().catch(e=>{ console.error(e); dismissSplash(); });
</script>

<script>
/* ════════ forest ambiance — slow drifting pollen / fireflies (faint, FPS-capped, paused when hidden, reduced-motion aware) ════════ */
(function(){
  const c=document.getElementById('pollen'); if(!c) return;
  const x=c.getContext('2d'); if(!x) return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr=Math.min(window.devicePixelRatio||1,2), FPS=24;
  let W=0,H=0,parts=[];
  const COLORS=['rgba(74,110,66,A)','rgba(96,130,80,A)','rgba(150,128,70,A)']; // muted sage + soft olive — read on the light bg
  function make(){ return {
    x:Math.random()*W, y:Math.random()*H,
    r:0.6+Math.random()*1.7,
    vx:(-0.12+Math.random()*0.24), vy:(-0.08-Math.random()*0.22),   // drift gently up + sideways
    a:0.12+Math.random()*0.28, ph:Math.random()*6.28, sp:0.006+Math.random()*0.012,
    col:COLORS[(Math.random()*COLORS.length)|0] }; }
  function paint(){ x.clearRect(0,0,W,H);
    for(const p of parts){
      const a=reduce?p.a.toFixed(2):(p.a*(0.55+0.45*Math.sin(p.ph))).toFixed(3);   // gentle firefly pulse (static when reduced-motion)
      x.beginPath(); x.fillStyle=p.col.replace('A',a);
      x.arc(p.x,p.y,p.r,0,6.2832); x.fill();
    } }
  // Safari's toolbar collapse fires resize with only a new HEIGHT: keep the particles then (no reshuffle), regenerate only
  // when the WIDTH changes. Resizing the canvas clears it, so always repaint (reduced-motion used to be left blank).
  function size(){ const nw=window.innerWidth, regen=nw!==W||!parts.length; W=nw; H=window.innerHeight;
    c.width=W*dpr; c.height=H*dpr; c.style.width=W+'px'; c.style.height=H+'px'; x.setTransform(dpr,0,0,dpr,0,0);
    if(regen){ const n=Math.min(90,Math.round(W*H/15000));   // denser on small phone viewports so the ambiance actually reads
      parts=Array.from({length:n},make); }
    paint(); }
  size(); let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(size,200);});
  let last=0, raf=0;
  function step(t){ raf=requestAnimationFrame(step); if(t-last<1000/FPS) return; last=t;
    for(const p of parts){
      p.x+=p.vx; p.y+=p.vy; p.ph+=p.sp;
      if(p.y<-6){ p.y=H+6; p.x=Math.random()*W; }
      if(p.x<-6) p.x=W+6; else if(p.x>W+6) p.x=-6;
    }
    paint(); }
  function start(){ if(!raf) raf=requestAnimationFrame(step); }
  function stop(){ cancelAnimationFrame(raf); raf=0; }
  if(!reduce){ start(); document.addEventListener('visibilitychange',()=>document.hidden?stop():start()); }
})();

/* ════════ fox: trots along the top edge of the Home overview, then stops to look around or curl up for a nap; faces its direction. Elthen pixel-art sprite (credited in More ▸ Sources). ════════ */
(function(){
  const fox=document.getElementById('fox'), img=document.getElementById('fox-img'); if(!fox||!img) return;
  const FOXV=(()=>{ const h=document.querySelector('link[rel="manifest"]'); const m=h&&/[?&]v=(\d+)/.exec(h.getAttribute('href')||''); return m?'?v='+m[1]:''; })();   // bust the fox PNG cache per code deploy (ties to the manifest ?v ship-counter)
  const WALK =[1,2,3,4,5,6,7,8].map(i=>'img/fox-walk-'+i+'.png'+FOXV);  // movement row → trot, 8 frames
  const IDLE =[1,2,3,4,5].map(i=>'img/fox-idle-'+i+'.png'+FOXV);        // standing idle (tail-wag), 5 frames
  const SLEEP=[1,2,3,4,5,6].map(i=>'img/fox-sleep-'+i+'.png'+FOXV);     // curled nap (breathing), 6 frames. All sliced from Elthen's 32x32 sheet via scripts/slice_fox.py; bottom-anchored, shared ground line.
  [...WALK,...IDLE,...SLEEP].forEach(s=>{const p=new Image();p.src=s;});// preload every frame
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let x=24, dir=1, mode='walk', last=0, walked=0, modeUntil=0, curSrc='', restT=0, raf=0, lastDraw=0, fw=0, fh=0;
  const SPEED=50;                                                     // px / second — a relaxed trot
  const STEP_PX=5;                                                    // advance one leg frame per this many px MOVED → legs lock to motion (feet plant, no skating); 8 frames × 5px ≈ 40px stride
  const IDLE_FPS=3.5, SLEEP_FPS=2;                                    // gentle, time-based (idle/sleep animate in place, not distance-locked)
  const FRAME_MS=1000/30;                                             // ~30 fps cap — plenty for a pixel sprite, half the battery of 60
  const home=document.getElementById('v-home');
  function setSrc(s){ if(s!==curSrc){ curSrc=s; img.src=s; } }
  function rest(t){                                                   // stop trotting → look around, or (rarer + longer) curl up for a nap
    restT=0;
    if(Math.random()<0.38){ mode='sleep'; modeUntil=t+6000+Math.random()*7000; }
    else { mode='idle'; modeUntil=t+2500+Math.random()*4000; }
  }
  function tick(t){
    // Home not on screen (or the page hidden) → the loop STOPS; showView()'s botany:view event / visibilitychange wake it
    if(document.hidden||!home||!home.classList.contains('on')){ raf=0; last=0; fox.classList.add('fox-off'); return; }
    raf=requestAnimationFrame(tick);
    if(t-lastDraw<FRAME_MS) return; lastDraw=t;
    const dt=last?Math.min(0.05,(t-last)/1000):0; last=t;
    const hero=home.querySelector('.hero');
    if(!hero){ fox.classList.add('fox-off'); return; }                 // Home is up but not rendered yet — keep polling
    fox.classList.remove('fox-off');
    const r=hero.getBoundingClientRect();
    const b=document.body.getBoundingClientRect();   // fox is position:absolute in body's coord space → it's content, so it zooms/pans WITH the hero under pinch (fixed detached). r-b deltas are layout coords = zoom-invariant.
    if(!fw){ fw=fox.offsetWidth; fh=fox.offsetHeight; }               // measured once (every frame shares one size); 0 until the PNG decodes → retried
    const minX=8, maxX=Math.max(minX, r.width-(fw||58)-8);
    if(reduce){ setSrc(IDLE[0]); }
    else if(mode==='walk'){
      const mv=SPEED*dt;
      x+=dir*mv; walked+=mv;                                          // distance moved drives the leg cycle
      if(x>=maxX){x=maxX;dir=-1;} else if(x<=minX){x=minX;dir=1;}
      setSrc(WALK[Math.floor(walked/STEP_PX)%WALK.length]);
      if(!modeUntil) modeUntil=t+4000+Math.random()*6000;
      if(t>modeUntil){ rest(t); }
    } else {                                                          // idle (standing) or sleep (curled) — animate the pose in place, time-based
      const arr = mode==='sleep'?SLEEP:IDLE, fps = mode==='sleep'?SLEEP_FPS:IDLE_FPS;
      restT+=dt;
      setSrc(arr[Math.floor(restT*fps)%arr.length]);
      if(t>modeUntil){ mode='walk'; modeUntil=t+4000+Math.random()*6000; }
    }
    fox.style.left=(r.left-b.left+x)+'px';
    fox.style.top=(r.top-b.top-(fh||58))+'px';                         // bottom-anchored: the 32x32 cell's bottom sits on the hero's top edge → consistent ground line across walk/idle/sleep
    img.style.transform = dir<0 ? 'scaleX(-1)' : 'none';              // sprite faces right; flip when heading left
  }
  function wake(){ if(!raf){ last=0; raf=requestAnimationFrame(tick); } }
  wake();
  document.addEventListener('botany:view',wake);                      // nav handler → Home is back → restart the loop
  document.addEventListener('visibilitychange',()=>{ last=0; if(!document.hidden) wake(); });   // no dt spike after the tab was hidden
  window.addEventListener('resize',()=>{ fw=0; });                    // re-measure after a zoom / rotation
})();

</script>
