<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robots">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080a0f'/%3E%3Cpolyline points='5,24 13,16 19,20 27,7' fill='none' stroke='%235b8cff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Robots</title>
<style>
  :root{
    --bg:#080a0f; --bg2:#0d1018; --panel:#11151f; --panel2:#161b27;
    --line:#222a3a; --line2:#2e394d;
    --ink:#e8edf6; --ink2:#aab4c6; --ink3:#6b7689;
    --accent:#5b8cff; --good:#34d399; --warn:#f5b945; --bad:#f06d6d; --ghost:#7c8aa0;
    --openai:#10a37f; --anthropic:#d97757; --google:#5b8cff; --xai:#9aa3b2;
    --mistral:#fa520f; --qwen:#a855f7; --nvidia:#76b900; --microsoft:#2da8f0;
    --moonshot:#ec4899; --meta:#2f6bff; --deepseek:#5b50e0; --zhipu:#12b5a6;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    --navh:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{max-width:560px;margin:0 auto;min-height:100vh;position:relative;
    border-left:1px solid var(--line);border-right:1px solid var(--line);
    background:radial-gradient(700px 380px at 80% -6%,rgba(91,140,255,.10),transparent 60%),var(--bg);}
  a{color:#8db4ff;text-decoration:none}

  header.bar{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    background:linear-gradient(180deg,var(--bg) 78%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar .row{display:flex;align-items:center;gap:10px}
  .logo{width:26px;height:26px;flex:none}
  .bar h1{font-size:19px;font-weight:780;letter-spacing:-.01em;margin:0}
  .bar .upd{margin-left:auto;text-align:right;font:600 10px var(--mono);color:var(--ink3);line-height:1.45;white-space:nowrap}
  .bar .upd b{color:var(--good)}

  main{padding:14px 14px calc(var(--navh) + env(safe-area-inset-bottom) + 22px)}
  .view{display:none;animation:fade .2s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .vh{font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:4px 0 4px}
  .vsub{font-size:12.5px;color:var(--ink3);margin:0 0 14px;line-height:1.5}

  /* filter chips */
  .filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px 4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--ink2);border-radius:999px;
    padding:5px 11px;font:600 12px var(--sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
  .fchip .sw{width:8px;height:8px;border-radius:50%}
  .fchip.off{opacity:.34}
  .fchip.all{border-color:var(--line2)}
  .fchip.on{border-color:var(--accent);color:var(--ink);background:rgba(91,140,255,.13)}

  /* model card */
  .mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;position:relative;overflow:hidden}
  .mcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lab,var(--ink3))}
  .mcard .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .mcard .nm{font-size:15.5px;font-weight:740}
  .mcard .lab{font:600 12px var(--sans);color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
  .mcard .lab .dot{width:7px;height:7px;border-radius:50%;background:var(--lab,var(--ink3))}
  .mcard .dt{margin-left:auto;font:600 11px var(--mono);color:var(--ink3)}
  .mcard .notable{font-size:12.5px;color:var(--ink2);margin-top:7px;line-height:1.45;max-height:3.2em;overflow:hidden;position:relative}
  .mcard.exp .notable{max-height:none}
  .mcard .notable.clip::after{content:"";position:absolute;right:0;bottom:0;width:40px;height:1.4em;background:linear-gradient(90deg,transparent,var(--panel))}
  .mcard .more{font:600 11px var(--mono);color:var(--accent);margin-top:4px;cursor:pointer}
  .specs{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .chiplet{font:600 11px var(--mono);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink2)}
  .chiplet b{color:var(--ink)}
  .chiplet.price b{color:var(--good)} .chiplet.price i{color:var(--warn);font-style:normal}
  .badge{font:700 9.5px var(--mono);padding:2px 6px;border-radius:5px;letter-spacing:.03em}
  .b-live{background:rgba(52,211,153,.12);color:var(--good)} .b-pulled{background:rgba(240,109,109,.12);color:var(--bad)}
  .b-preview{background:rgba(245,185,69,.12);color:var(--warn)} .b-open{background:rgba(91,140,255,.12);color:#7ea6ff}
  .b-historic{background:rgba(154,163,178,.12);color:var(--ghost)} .b-milestone{background:rgba(245,185,69,.14);color:var(--warn)}

  /* timeline */
  .tl{position:relative;padding-left:20px;margin-top:6px}
  .tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line2)}
  .tnode{position:relative;margin-bottom:15px}
  .tnode::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--lab,var(--accent));box-shadow:0 0 0 4px var(--bg)}
  .tnode .yr{font:700 11px var(--mono);color:var(--accent)}
  .tnode .nm{font-size:14.5px;font-weight:720;margin-top:1px}
  .tnode .nm .lab{font:600 11px var(--sans);color:var(--ink3);margin-left:6px}
  .tnode .why{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.45}
  .showall{text-align:center;margin:6px 0 2px}
  .showall button{background:var(--panel);border:1px solid var(--line2);color:var(--accent);border-radius:999px;padding:8px 18px;font:650 12.5px var(--sans);cursor:pointer}

  /* accordion */
  details.acc{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
  details.acc>summary{cursor:pointer;padding:13px 15px;font-weight:720;font-size:14.5px;display:flex;align-items:center;gap:9px;list-style:none}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary .tw{transition:.2s;color:var(--ink3);font-size:11px}
  details.acc[open]>summary .tw{transform:rotate(90deg)}
  details.acc>summary .ct{margin-left:auto;font:600 11px var(--mono);color:var(--ink3)}
  details.acc .body{padding:0 13px 14px}
  .accsub{font-size:11.5px;color:var(--ink3);margin:-2px 0 10px;line-height:1.45}

  /* charts */
  .svgchart{display:block;width:100%;height:auto;overflow:visible}
  .svgchart text{font-family:var(--mono);fill:var(--ink3)}
  .svgchart .mn{font-family:var(--mono)}
  .chartcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 12px 10px;margin-bottom:11px}
  .chartcard h4{margin:0 0 2px;font-size:13.5px;font-weight:720;color:var(--ink)}
  .chartcard .cd{font-size:11px;color:var(--ink3);margin-bottom:8px;line-height:1.4}
  .lgd{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font:600 10px var(--mono);color:var(--ink3)}
  .lgd span{display:inline-flex;align-items:center;gap:5px}
  .swline{width:13px;height:0;border-top:2px solid var(--accent)} .swdash{width:13px;height:0;border-top:2px dashed var(--warn)}
  .swband{width:11px;height:8px;border-radius:2px;background:rgba(245,185,69,.2);border:1px solid rgba(245,185,69,.4)}
  .sattag{font:700 9px var(--mono);color:var(--ghost);background:rgba(154,163,178,.1);padding:2px 5px;border-radius:5px}

  /* horizontal bar (head-to-head + weights) */
  .bar{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;margin-bottom:8px}
  .bar .bl{font-size:11.5px;color:var(--ink2);text-align:right;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{height:18px;background:var(--bg);border-radius:5px;overflow:hidden;position:relative;border:1px solid var(--line)}
  .bar .fill{height:100%;border-radius:4px}
  .bar .bv{font:700 11.5px var(--mono);color:var(--ink)}
  .ceil-tick{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed rgba(245,185,69,.6);z-index:3}
  .ceil-lab{font:700 10px var(--mono);color:var(--warn);margin:0 0 9px;display:flex;align-items:center;gap:7px}
  .ceil-lab::before{content:"";width:16px;border-top:2px dashed rgba(245,185,69,.6)}
  .wlabel{font:600 10.5px var(--mono);color:var(--ink2);white-space:nowrap}

  /* cadence stats */
  .cadstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 14px}
  .cadstat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .cadstat .v{font:780 18px var(--sans);color:var(--ink);line-height:1.1}
  .cadstat .v small{font-size:11px;color:var(--ink2);font-weight:600}
  .cadstat .l{font:600 10.5px var(--sans);color:var(--ink3);margin-top:4px;line-height:1.3}

  /* prediction gauge */
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .pcard .ptop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .pcard .pnm{font-size:14.5px;font-weight:730}
  .pcard .pbench{margin-left:auto;font:700 10.5px var(--mono);color:var(--accent)}
  .pcard .pmeta{font:600 10.5px var(--mono);color:var(--ink3);margin-top:2px}
  .pcard .basis{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.45}
  .gauge{margin-top:10px}
  .gauge .gtrack{position:relative;height:28px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .gauge .band{position:absolute;top:0;bottom:0;background:rgba(245,185,69,.16);border-left:1px solid rgba(245,185,69,.5);border-right:1px solid rgba(245,185,69,.5)}
  .gauge .pt{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--warn);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--panel)}
  .gauge .gv{position:absolute;top:-1px;transform:translateX(-50%);font:700 11px var(--mono);color:var(--warn)}
  .gauge .lbls{display:flex;justify-content:space-between;font:600 9.5px var(--mono);color:var(--ink3);margin-top:4px}
  .conf{font:700 9px var(--mono);padding:2px 6px;border-radius:5px}
  .conf.high{background:rgba(52,211,153,.12);color:var(--good)} .conf.medium{background:rgba(245,185,69,.12);color:var(--warn)} .conf.low{background:rgba(240,109,109,.12);color:var(--bad)}

  /* leaderboard */
  .lbrow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
  .lbrow.gold{border-color:rgba(245,185,69,.4);background:linear-gradient(100deg,rgba(245,185,69,.07),var(--bg2))}
  .lbrank{font:780 19px var(--mono);color:var(--ink3);text-align:center}
  .lbrow.gold .lbrank{color:var(--warn)}
  .lbname{font-weight:730;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .lbsub{font:600 10.5px var(--mono);color:var(--ink3);margin-top:2px}
  .lbscore{text-align:right;font:780 18px var(--mono);color:var(--ink)}
  .lbscore small{display:block;font:600 8.5px var(--mono);color:var(--ink3);letter-spacing:.05em}

  /* upcoming + killed rows */
  .hrow{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
  .hrow.rum{opacity:.82;border-style:dashed}
  .hname{font-size:13.5px;font-weight:720;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .hname .dot{width:8px;height:8px;border-radius:50%}
  .hwhat{font-size:12px;color:var(--ink2);line-height:1.45}
  .hpill{font:700 9px var(--mono);padding:2px 6px;border-radius:5px}
  .h-un{background:rgba(245,185,69,.12);color:var(--warn)} .h-soon{background:rgba(91,140,255,.12);color:#7ea6ff}
  .h-rum{background:rgba(154,163,178,.1);color:var(--ghost)}
  .kill{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
  .kill .x{color:var(--bad);font-weight:800;flex:none}
  .kclaim{font-size:12.5px;color:var(--ink);font-weight:600;margin-bottom:3px;line-height:1.4}
  .kmeta{font:600 10.5px var(--mono);color:var(--ink3)}
  .correction{background:linear-gradient(100deg,rgba(52,211,153,.09),var(--bg2));border:1px solid rgba(52,211,153,.3);border-left:3px solid var(--good);border-radius:11px;padding:11px 13px;font-size:12px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
  .correction b{color:var(--ink)}
  .src{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:11.5px}
  .src:first-child{border-top:none}
  .src a{color:#8db4ff;word-break:break-all}
  .sq{font:700 8.5px var(--mono);padding:2px 5px;border-radius:4px;flex:none}
  .sq.primary{background:rgba(52,211,153,.13);color:var(--good)} .sq.secondary{background:rgba(91,140,255,.13);color:#7ea6ff} .sq.blog{background:rgba(154,163,178,.12);color:var(--ghost)}

  .note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink2);line-height:1.55;margin-bottom:10px}
  .note b{color:var(--ink)}
  .caveat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:11px}
  .caveat b{color:var(--ink2)}
  .empty{text-align:center;color:var(--ink3);font-size:12.5px;padding:24px 10px}

  nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:30;
    display:flex;background:rgba(12,15,22,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);height:calc(var(--navh) + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:none;color:var(--ink3);font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:8px 2px;transition:color .15s}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs button svg{width:20px;height:20px}
  nav.tabs button span{font-size:9.5px;font-weight:650}

  /* home */
  .hero{font-size:13px;color:var(--ink2);line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:13px}
  .hero b{color:var(--ink)}
  .hsec{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
  .hsec::after{content:"";flex:1;height:1px;background:var(--line)}
  .bestgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bestcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;border-left:3px solid var(--lab,var(--accent))}
  .bclabel{font:600 10.5px var(--sans);color:var(--ink3)}
  .bcname{font-size:13.5px;font-weight:730;margin-top:3px;line-height:1.2}
  .bcval{font:700 11.5px var(--mono);color:var(--accent);margin-top:4px}
  .explore{display:flex;flex-direction:column;gap:7px}
  .explore button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px;cursor:pointer;display:flex;align-items:baseline;gap:10px;color:var(--ink2);width:100%;font-family:var(--sans)}
  .explore button b{color:var(--ink);font-size:13.5px;min-width:58px}
  .explore button span{font-size:11.5px;color:var(--ink3)}
  .explore button::after{content:"›";margin-left:auto;color:var(--ink3);font-size:18px;align-self:center}
</style>
</head>
<body>

<header class="bar">
  <div class="row">
    <svg class="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#11151f" stroke="#222a3a"/><polyline points="5,24 13,16 19,20 27,7" fill="none" stroke="#5b8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Robots</h1>
    <div class="upd" id="upd">loading…</div>
  </div>
</header>

<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-now"></section>
  <section class="view" id="v-history"></section>
  <section class="view" id="v-charts"></section>
  <section class="view" id="v-predict"></section>
  <section class="view" id="v-more"></section>
</main>

<nav class="tabs" id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span>Home</span></button>
  <button data-v="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Now</span></button>
  <button data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v14M4 7h13l-2.5 3L17 13H4"/></svg><span>History</span></button>
  <button data-v="charts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 8-9"/><path d="M3 21h18"/></svg><span>Charts</span></button>
  <button data-v="predict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 1 4 10.5c-.7.6-1 1-1 2v.5H9V15c0-1-.3-1.4-1-2A6 6 0 0 1 12 3z"/><path d="M9.5 21h5"/></svg><span>Predict</span></button>
  <button data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
</nav>

<script>
const LABV = {OpenAI:'--openai',Anthropic:'--anthropic',Google:'--google','Google DeepMind':'--google',DeepMind:'--google',xAI:'--xai',Mistral:'--mistral','Mistral AI':'--mistral',Alibaba:'--qwen','Alibaba (Qwen)':'--qwen',Qwen:'--qwen',NVIDIA:'--nvidia',Microsoft:'--microsoft','Microsoft + NVIDIA':'--microsoft',Moonshot:'--moonshot','Moonshot AI':'--moonshot',Meta:'--meta','Meta AI':'--meta','Meta Superintelligence Labs':'--meta',DeepSeek:'--deepseek',Zhipu:'--zhipu','Z.ai':'--zhipu','Zhipu / Z.ai':'--zhipu','Zhipu AI':'--zhipu'};
function labVar(l){ if(LABV[l]) return LABV[l]; const k=Object.keys(LABV).find(x=>l&&l.includes(x.split(' ')[0])); return k?LABV[k]:'--ghost'; }
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const labHex = l => css(labVar(l)) || css('--ghost');

function timeAgo(d){const s=(Date.now()-d.getTime())/1000;if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
const MM=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let homeOpenOnly=false;
function benchOf(m,cat){const b=m.benchmarks||{},ks=Object.keys(b);
  const re={aa:/aa[ -]?index|intelligence index/i,swe:/swe[ -]?bench/i,gpqa:/gpqa/i,aime:/aime/i}[cat];
  if(!re)return null;
  const vals=ks.filter(k=>re.test(k)).map(k=>b[k]).filter(v=>typeof v==='number');
  return vals.length?Math.max(...vals):null;}
function ctxNum(s){if(!s)return 0;const m=(''+s).match(/([\d.]+)\s*([KMT])?/i);if(!m)return 0;let v=+m[1];const u=(m[2]||'').toUpperCase();if(u==='K')v*=1e3;if(u==='M')v*=1e6;if(u==='T')v*=1e9;return v;}
function outPrice(name){const p=priceFor(name);return p?+p.split('/')[1]:null;}
const USECASES=[{label:'Top overall',cat:'aa',suf:''},{label:'Coding',cat:'swe',suf:'%'},{label:'Science · GPQA',cat:'gpqa',suf:'%'},{label:'Math · AIME',cat:'aime',suf:'%'},{label:'Longest context',cat:'context'},{label:'Best value',cat:'value'}];
function pickBest(cands,uc){
  if(uc.cat==='context'){let b=null,bv=0;cands.forEach(m=>{const v=ctxNum(m.context);if(v>bv){bv=v;b=m;}});return b?{m:b,disp:(b.context||'').replace(/\s*[\(/].*$/,'').trim()+' ctx'}:null;}
  if(uc.cat==='value'){let b=null,bs=-1;cands.forEach(m=>{const aa=benchOf(m,'aa'),p=outPrice(m.name);if(aa&&p){const s=aa/p;if(s>bs){bs=s;b=m;}}});return b?{m:b,disp:'$'+outPrice(b.name)+'/M'}:null;}
  let b=null,bv=-1;cands.forEach(m=>{const v=benchOf(m,uc.cat);if(v!=null&&v>bv){bv=v;b=m;}});return b?{m:b,disp:bv+(uc.suf||'')}:null;
}

// ---------------- CHARTS ----------------
function tval(s){const p=(s||'').split('-');return(+p[0]||2020)+((+p[1]||1)-1)/12;}
function trendChart(t){
  const C={line:css('--line'),ink3:css('--ink3'),accent:css('--accent'),warn:css('--warn'),bg:css('--bg')};
  const meas=(t.points||[]).slice().sort((a,b)=>tval(a.date)-tval(b.date));
  const pred=(t.predicted||[]).slice().sort((a,b)=>tval(a.date)-tval(b.date));
  if(!meas.length) return '<div class="empty">No data.</div>';
  const all=[...meas,...pred], xs=all.map(p=>tval(p.date)), ys=all.flatMap(p=>[p.value,p.low,p.high].filter(v=>v!=null));
  let x0v=Math.min(...xs),x1v=Math.max(...xs); if(x1v===x0v)x1v+=.5;
  let y0v=Math.min(...ys),y1v=Math.max(...ys); const pad=(y1v-y0v)*.12||5; y0v-=pad; y1v+=pad;
  const W=500,H=170,L=32,R=10,T=10,B=24;
  const X=v=>L+((tval(v)-x0v)/(x1v-x0v))*(W-L-R), Y=v=>T+(1-(v-y0v)/(y1v-y0v))*(H-T-B);
  let s=`<svg class="svgchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:170px">`;
  for(let i=0;i<=3;i++){const yy=y0v+(y1v-y0v)*i/3,py=Y(yy).toFixed(1);s+=`<line x1="${L}" y1="${py}" x2="${W-R}" y2="${py}" stroke="${C.line}" opacity=".5"/><text x="${L-4}" y="${(+py+3).toFixed(1)}" font-size="9" text-anchor="end">${yy.toFixed(0)}</text>`;}
  [...new Set(all.map(p=>+yr(p.date)))].sort().forEach(y=>{s+=`<text x="${X(y+'-06').toFixed(1)}" y="${H-6}" font-size="9" text-anchor="middle">'${String(y).slice(2)}</text>`;});
  if(pred.length){const last=meas[meas.length-1],lo=[{date:last.date,low:last.value,high:last.value},...pred.filter(p=>p.low!=null)];
    if(lo.length>1){const up=lo.map(p=>`${X(p.date).toFixed(1)},${Y(p.high).toFixed(1)}`),dn=lo.slice().reverse().map(p=>`${X(p.date).toFixed(1)},${Y(p.low).toFixed(1)}`);s+=`<polygon points="${up.concat(dn).join(' ')}" fill="${C.warn}" opacity=".16"/>`;}
    s+=`<polyline points="${[last,...pred].map(p=>`${X(p.date).toFixed(1)},${Y(p.value).toFixed(1)}`).join(' ')}" fill="none" stroke="${C.warn}" stroke-width="2" stroke-dasharray="5 4"/>`;
    pred.forEach(p=>s+=`<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="4" fill="${C.bg}" stroke="${C.warn}" stroke-width="2"><title>${p.model}: ${p.value} (band ${p.low}–${p.high})</title></circle>`);}
  s+=`<polyline points="${meas.map(p=>`${X(p.date).toFixed(1)},${Y(p.value).toFixed(1)}`).join(' ')}" fill="none" stroke="${C.accent}" stroke-width="2.5" stroke-linejoin="round"/>`;
  meas.forEach(p=>s+=`<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="3.5" fill="${C.accent}" stroke="${C.bg}" stroke-width="1.5"><title>${p.model}: ${p.value} ${fmtDate(p.date)}</title></circle>`);
  return s+'</svg>';
}
function barChart(data,max,ceil){
  const tick=ceil?`<div class="ceil-tick" style="left:${(ceil/max*100).toFixed(1)}%"></div>`:'';
  const lab=ceil?`<div class="ceil-lab">prior ceiling ≈ ${ceil}</div>`:'';
  return lab+data.map(d=>`<div class="bar"><div class="bl">${d.l}</div><div class="track">${tick}<div class="fill" style="width:${(d.v/max*100).toFixed(1)}%;background:${labHex(d.lab)};${d.hl?'box-shadow:0 0 10px '+labHex(d.lab):''};${d.approx?'opacity:.6':''}"></div></div><div class="bv">${d.v}${d.approx?'~':''}</div></div>`).join('');
}
const DAYMS=864e5, ddays=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/DAYMS);
function cadence(){
  const C={line:css('--line'),ink3:css('--ink3'),ink2:css('--ink2'),bg:css('--bg')};
  const all=DATA.models.filter(m=>(m.released||'')>='2026-01').map(m=>({lab:m.lab,sort:(m.released||'').slice(0,10)})).filter(m=>m.sort.length>=7);
  if(!all.length) return {stats:'',svg:'<div class="empty">No 2026 data.</div>'};
  const labCount={},labFirst={};all.forEach(m=>{labCount[m.lab]=(labCount[m.lab]||0)+1;if(!labFirst[m.lab]||m.sort<labFirst[m.lab])labFirst[m.lab]=m.sort;});
  const lanes=Object.keys(labCount).sort((a,b)=>labCount[b]-labCount[a]||(labFirst[a]<labFirst[b]?-1:1)).slice(0,10);
  const dates=[...new Set(all.map(m=>m.sort))].sort();
  const gaps=dates.slice(1).map((d,i)=>ddays(dates[i],d)),sg=[...gaps].sort((a,b)=>a-b);
  const median=sg.length?(sg.length%2?sg[(sg.length-1)/2]:(sg[sg.length/2-1]+sg[sg.length/2])/2):0;
  const span=ddays(dates[0],dates[dates.length-1]),top1=lanes[0];
  const byMo={};all.forEach(m=>{const k=m.sort.slice(0,7);byMo[k]=(byMo[k]||0)+1;});
  const moE=Object.entries(byMo).sort((a,b)=>b[1]-a[1]),busy=moE[0],quiet=moE[moE.length-1];
  const stats=`<div class="cadstats">
    <div class="cadstat"><div class="v">${all.length} <small>releases</small></div><div class="l">${lanes.length} labs · ${span}-day span</div></div>
    <div class="cadstat"><div class="v">~${(span/Math.max(1,all.length-1)).toFixed(1)}d <small>each</small></div><div class="l">median ${median}d between dates</div></div>
    <div class="cadstat"><div class="v">${top1} <small>led</small></div><div class="l">${labCount[top1]} releases</div></div>
    <div class="cadstat"><div class="v">${MM[+busy[0].slice(5)]} ${busy[1]}</div><div class="l">busiest · ${MM[+quiet[0].slice(5)]} ${quiet[1]} quietest</div></div></div>`;
  const TS0=new Date('2026-02-01'),TS1=new Date('2026-06-30');
  const MO=[['2026-02','Feb'],['2026-03','Mar'],['2026-04','Apr'],['2026-05','May'],['2026-06','Jun']];
  const x0=86,x1=466,top=10,lh=24,bot=22,H=top+lanes.length*lh+bot,botY=top+lanes.length*lh;
  const dx=iso=>x0+(new Date(iso+'T00:00:00')-TS0)/(TS1-TS0)*(x1-x0);
  const grp={};all.forEach(m=>{const k=m.lab+'|'+m.sort;(grp[k]=grp[k]||{lab:m.lab,sort:m.sort,n:0}).n++;});
  let s=`<svg class="svgchart" viewBox="0 0 500 ${H}">`;
  gaps.forEach((g,i)=>{if(g>=21){const xa=dx(dates[i])+4,xb=dx(dates[i+1])-4;s+=`<rect x="${xa.toFixed(1)}" y="${top}" width="${(xb-xa).toFixed(1)}" height="${lanes.length*lh}" fill="${C.ink3}" opacity=".07"/><text class="mn" x="${((xa+xb)/2).toFixed(1)}" y="${(botY-6).toFixed(1)}" font-size="8.5" text-anchor="middle" fill="${C.ink3}">${g}d</text>`;}});
  MO.forEach(([iso,l])=>{const x=dx(iso+'-01').toFixed(1);s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${botY}" stroke="${C.line}"/><text class="mn" x="${x}" y="${botY+15}" font-size="9" text-anchor="middle" fill="${C.ink3}">${l}</text>`;});
  lanes.forEach((lab,i)=>{const y=top+i*lh+lh/2;s+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" opacity=".5"/><text x="${x0-8}" y="${y+3}" font-size="10" font-weight="700" text-anchor="end" fill="${labHex(lab)}" font-family="var(--sans)">${lab.split(' ')[0]}</text><text class="mn" x="${x1+10}" y="${y+3}" font-size="10" font-weight="700" fill="${C.ink2}">${labCount[lab]}</text>`;});
  Object.values(grp).forEach(g=>{const i=lanes.indexOf(g.lab);if(i<0)return;const y=top+i*lh+lh/2,r=(3.5+(g.n-1)*1.4).toFixed(1);s+=`<circle cx="${dx(g.sort).toFixed(1)}" cy="${y}" r="${r}" fill="${labHex(g.lab)}" stroke="${C.bg}" stroke-width="1.3"><title>${g.lab} ×${g.n} — ${fmtDate(g.sort)}</title></circle>`;});
  return {stats, svg:s+'</svg>'};
}
function weightsChart(){
  const C={line:css('--line'),ink3:css('--ink3'),ink2:css('--ink2')};
  const x0=92,x1=400,top=8,rh=26,bh=11,H=top+WEIGHTS.length*rh+22,LG=Math.log10(2000),xS=p=>x0+Math.log10(p)/LG*(x1-x0);
  let s=`<svg class="svgchart" viewBox="0 0 500 ${H}">`;
  [1,10,100,1000].forEach(p=>{const x=xS(p).toFixed(1);s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${top+WEIGHTS.length*rh}" stroke="${C.line}" opacity=".5"/><text class="mn" x="${x}" y="${top+WEIGHTS.length*rh+15}" font-size="9" text-anchor="middle" fill="${C.ink3}">${p>=1000?'1T':p+'B'}</text>`;});
  WEIGHTS.forEach((m,i)=>{const y=top+i*rh+rh/2,col=labHex(m.lab),xt=xS(m.total),xa=xS(m.active);
    s+=`<text x="${x0-7}" y="${y+3}" font-size="10" font-weight="700" text-anchor="end" fill="${col}" font-family="var(--sans)">${m.n.replace(/ .*/,'')}</text>`;
    s+=`<rect x="${x0}" y="${(y-bh/2).toFixed(1)}" width="${(xt-x0).toFixed(1)}" height="${bh}" rx="2.5" fill="${col}" opacity=".26"/><rect x="${x0}" y="${(y-bh/2).toFixed(1)}" width="${(xa-x0).toFixed(1)}" height="${bh}" rx="2.5" fill="${col}"><title>${m.n}: ${m.total>=1000?(m.total/1000)+'T':m.total+'B'} total, ${m.active}B active</title></rect>`;
    const sp=Math.round(m.total/m.active),lbl=m.dense?'dense':`${sp}×`;
    s+=`<text class="mn" x="${(xt+6).toFixed(1)}" y="${y+3}" font-size="9.5" fill="${C.ink2}">${m.total>=1000?(m.total/1000)+'T':m.total+'B'} · ${lbl}</text>`;});
  return s+'</svg>';
}
function renderCharts(){
  const cad=cadence();
  $('#v-charts').innerHTML = `<div class="vh">Charts</div>
    <div class="vsub">Tap a section to open. Solid = measured, dashed + shaded = forecast with its uncertainty band.</div>
    <details class="acc" open><summary><span class="tw">▶</span>Trends over time<span class="ct">${DATA.trends.length}</span></summary>
      <div class="body">${DATA.trends.map(t=>`<div class="chartcard"><h4>${t.benchmark} ${t.saturated?'<span class="sattag">SATURATED</span>':''}</h4><div class="cd">${t.unit||''}${t.notes?' · '+t.notes:''}</div>${trendChart(t)}<div class="lgd"><span><span class="swline"></span>measured</span>${(t.predicted&&t.predicted.length)?'<span><span class="swdash"></span>forecast</span><span><span class="swband"></span>uncertainty</span>':''}</div></div>`).join('')||'<div class="empty">No trends.</div>'}</div></details>
    <details class="acc"><summary><span class="tw">▶</span>Release cadence — 2026</summary>
      <div class="body"><div class="accsub">Every 2026 release on its ship date, by lab lane. Dot size = same-day multi-drops; shaded = lulls.</div>${cad.stats}${cad.svg}</div></details>
    <details class="acc"><summary><span class="tw">▶</span>Open weights — size &amp; sparsity</summary>
      <div class="body"><div class="accsub">Total weights (dim) vs active per token (bright), log scale. The gap is the MoE efficiency win; × = sparsity.</div>${weightsChart()}</div></details>
    <details class="acc"><summary><span class="tw">▶</span>Head-to-head</summary>
      <div class="body"><div class="chartcard"><h4>AA Intelligence Index — the ~57 ceiling</h4><div class="cd">GPT-5.5 then Fable 5 first to clear it; version-stamped, treat as rough.</div>${barChart(HH_AA,65,57)}</div>
      <div class="chartcard"><h4>SWE-bench Pro — coding</h4><div class="cd">% of real software-eng issues resolved.</div>${barChart(HH_SWE,100)}</div></div></details>`;
}

// ---------------- PREDICT ----------------
function renderPredict(){
  const ps=DATA.predictions||[];
  $('#v-predict').innerHTML = `<div class="vh">Predictions &amp; what's coming</div>
    <div class="vsub">Where un-tested or announced models are likely to land — point estimate + an honest uncertainty band.</div>
    ${ps.length?ps.map(p=>{
      const lo=Math.min(p.low,p.predicted),hi=Math.max(p.high,p.predicted),span=hi-lo||1;
      const bl=((p.low-lo)/span)*100,bw=((p.high-p.low)/span)*100,pp=((p.predicted-lo)/span)*100;
      return `<div class="pcard"><div class="ptop"><span class="pnm">${p.model}</span><span class="pbench">${(p.benchmark||'').replace(/\s*\(.*\)/,'')}</span></div>
        <div class="pmeta">${p.lab||''}${p.expectedDate?' · '+p.expectedDate:''} ${p.confidence?`<span class="conf ${p.confidence}">${p.confidence.toUpperCase()}</span>`:''}</div>
        <div class="gauge"><div class="gtrack"><div class="band" style="left:${bl}%;width:${bw}%"></div><div class="gv" style="left:${pp}%">${p.predicted}</div><div class="pt" style="left:${pp}%"></div></div>
        <div class="lbls"><span>${lo.toFixed(0)}</span><span>band ${p.low}–${p.high}</span><span>${hi.toFixed(0)}</span></div></div>
        ${p.basis?`<div class="basis">${p.basis}</div>`:''}</div>`;}).join(''):'<div class="empty">No forecasts.</div>'}
    <div class="vh" style="margin-top:22px">On the horizon</div>
    <div class="vsub">Announced, expected, or rumored — graded by signal strength. Generative-media is honestly flagged rumored (failed fact-check).</div>
    ${UPCOMING.map(u=>`<div class="hrow ${u.status==='rum'?'rum':''}"><div class="hname">${u.lab?`<span class="dot" style="background:${labHex(u.lab)}"></span>`:''}${u.name} <span class="hpill ${u.status==='un'?'h-un':u.status==='soon'?'h-soon':'h-rum'}">${u.status==='un'?'UNRELEASED':u.status==='soon'?'EXPECTED':'RUMORED'}</span></div><div class="hwhat">${u.what}</div></div>`).join('')}`;
}

// ---------------- MORE ----------------
function renderMore(){
  const m=DATA.meta||{};
  $('#v-more').innerHTML = `<div class="vh">More</div>
    <details class="acc" open><summary><span class="tw">▶</span>Leaderboard<span class="ct">LLM-Stats</span></summary>
      <div class="body"><div class="accsub">LLM-Stats composite "Score" on the last snapshot — one ranking, reasoning-weighted. #1 is unreleased; the board is noisy.</div>
      ${LB.map(r=>`<div class="lbrow ${r.gold?'gold':''}"><div class="lbrank">${r.rank}</div><div><div class="lbname"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${labHex(r.lab)}"></span>${r.name} ${statusBadge(r.flag)}</div><div class="lbsub">${r.lab} · ${r.sub}</div></div><div class="lbscore">${r.score}<small>LLM-STATS</small></div></div>`).join('')}
      <div class="caveat">Conflicts with the Artificial Analysis index (which orders GPT-5.5 / Fable 5 / GLM-5.2 / Grok 4.3 differently). Different operators, different weightings — no single board is authoritative.</div></div></details>
    <details class="acc"><summary><span class="tw">▶</span>Didn't make the cut<span class="ct">${KILLED.length}</span></summary>
      <div class="body"><div class="correction"><b>Re-sweep correction:</b> a 2nd research pass overturned <b>5 earlier refutations</b> with primary sources — GLM-5.2, DeepSeek V4-Pro/Flash, Meta Muse Spark, Grok 4.20/4.3 are all real, now in the tables. A refute means "not yet verified," not "false forever." Below = still unverified or wrong:</div>
      ${KILLED.map(k=>`<div class="kill"><div class="x">✗</div><div><div class="kclaim">${k.claim}</div><div class="kmeta">refuted ${k.vote} · ${k.src}</div></div></div>`).join('')}</div></details>
    <details class="acc"><summary><span class="tw">▶</span>Sources<span class="ct">${SOURCES.length}+</span></summary>
      <div class="body"><div class="accsub">Backbone dates/benchmarks trace to primary vendor/model-card/HF sources; pricing & some scores via aggregators, kept only on corroboration.</div>
      ${SOURCES.map(s=>`<div class="src"><span class="sq ${s.q}">${s.q.slice(0,4).toUpperCase()}</span><span>${s.u}</span></div>`).join('')}</div></details>
    <details class="acc"><summary><span class="tw">▶</span>How it works</summary>
      <div class="body">
        <div class="note"><b>Robots</b> is a living record of public AI — every landmark since GPT-3 (Jun 2020), the benchmark curves, and forecasts. Built for Christian &amp; his dad.</div>
        <div class="note"><b>It updates itself</b> twice a day: a research pass finds new models/benchmarks, verifies them, and pushes here automatically. Last update <b style="color:var(--good)">${m.lastUpdated?fmtDate(m.lastUpdated.slice(0,10)):'—'}</b> · ${m.sweeps||0} sweeps · v${m.dataVersion||0}.</div>
        <div class="note"><b>Predictions.</b> ${DATA.methodology||'For un-tested models we fit the recent frontier trajectory of a benchmark, place the estimate at the model\'s expected date, and widen the band the further out we forecast. Measured data always overrides a forecast on the next sweep.'}</div>
        <div class="caveat">Benchmark indices are version-stamped and not always cross-comparable; aggregator leaderboards disagree. A snapshot of a field that moves weekly.</div>
      </div></details>`;
}

// ---------------- events ----------------
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$$('.view').forEach(v=>v.classList.remove('on'));$('#v-'+b.dataset.v).classList.add('on');window.scrollTo(0,0);});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]'); if(g){const t=g.dataset.goto;$$('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===t));$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));window.scrollTo(0,0);return;}
  const f=e.target.closest('.fchip'); if(f){ if(f.dataset.ho!==undefined){homeOpenOnly=f.dataset.ho==='1';renderHome();} else if(f.dataset.hf!==undefined){histFrontierOnly=f.dataset.hf==='1';histAll=false;renderHistory();} else {nowFilter=f.dataset.lab||null;renderNow();} return;}
  const mo=e.target.closest('.more'); if(mo){const c=mo.closest('.mcard');c.classList.toggle('exp');c.querySelector('.notable').classList.toggle('clip');mo.textContent=c.classList.contains('exp')?'less ▴':'more ▾';return;}
  if(e.target.id==='histmore'){histAll=true;renderHistory();}
});

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
boot();
</script>
