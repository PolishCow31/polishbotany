<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16261d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Botany">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316261d'/%3E%3Cpath d='M16 6 C10 11 10 21 16 26 C22 21 22 11 16 6 Z' fill='none' stroke='%2362c177' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M16 9 L16 24' stroke='%2362c177' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap">
<title>Botany</title>
<style>
  :root{
    /* ── forest / woodland — chrome (LIGHTENED: softer mid-forest cards, dropped the harsh near-black greens) ── */
    --bg:#16261d; --bg2:#1e3327; --panel:#213a2c; --panel2:#294835;
    --line:#3b6249; --line2:#4f8463;
    --ink:#eef4ea; --ink2:#b3c8b7; --ink3:#88a48e;
    --accent:#62c177; --good:#62c177; --warn:#d99a4e; --bad:#d9684f; --ghost:#7a977f;
    --bark:#6b4a2f; --bark2:#8a5e3a;
    /* ── lab colors re-tinted to natural hues (max hue-spread so charts stay readable) ── */
    --openai:#2e8b74; --anthropic:#c8744a; --google:#5b9ccb; --xai:#8f8a7e;
    --mistral:#cf6a2a; --qwen:#9159a0; --nvidia:#7a9e3c; --microsoft:#3f9fb0;
    --moonshot:#c25b86; --meta:#4f5aa8; --deepseek:#9072cc; --zhipu:#3bb39a;
    --mono:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Fraunces",Georgia,"Times New Roman",serif;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --navh:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#16261d}
  html,body{margin:0;padding:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  body{max-width:560px;margin:0 auto;min-height:100vh;position:relative;
    background:transparent;}
  /* soft light-sage watercolor texture — even & airy behind the cards */
  #forest{position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:url(img/bgtex-a.jpeg) center top/cover fixed, #cfe3c2;}
  #pollen{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;opacity:.55}
  ::selection{background:rgba(98,193,119,.28);color:#fff}
  a{color:#8fd6a0;text-decoration:none}

  header.bar{display:block;position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    background:linear-gradient(180deg,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}  /* display:block guards against the .bar bar-chart grid (class-name collision, line ~234) */
  .bar .row{display:flex;align-items:center;gap:11px;width:100%}
  .logo{width:30px;height:30px;flex:none}
  .bar h1{font-size:23.8px;font-weight:780;letter-spacing:-.01em;margin:0;line-height:1.02;color:var(--ink)}
  .bar .brand{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .bar .tagline{margin:0;font-size:12.4px;font-weight:500;color:var(--accent);letter-spacing:.005em;line-height:1.25}
  .bar .upd{margin-left:auto;text-align:right;font:600 12.5px var(--mono);color:var(--ink3);line-height:1.45;white-space:nowrap}
  .bar .upd b{color:var(--good)}

  main{padding:14px 14px calc(var(--navh) + env(safe-area-inset-bottom) + 22px)}
  .view{display:none;animation:fade .2s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .vh{font:700 15.0px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:4px 0 4px}
  .vsub{font-size:15.6px;color:var(--ink3);margin:0 0 14px;line-height:1.5}

  /* filter chips */
  .filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px 4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--ink2);border-radius:999px;
    padding:5px 11px;font:600 15.0px var(--sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
  .fchip .sw{width:8px;height:8px;border-radius:50%}
  .fchip.off{opacity:.34}
  .fchip.all{border-color:var(--line2)}
  .fchip.on{border-color:var(--accent);color:var(--ink);background:rgba(91,140,255,.13)}
  /* segmented Frontier ↔ Open switch */
  .seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px;max-width:100%}
  .seg button{border:none;background:none;color:var(--ink3);font:650 15.6px var(--sans);padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.12s}
  .seg button.on{background:var(--panel2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .seg button[data-mode="open"].on{color:#7ea6ff}

  /* model card */
  .badge{font:700 11.9px var(--mono);padding:2px 6px;border-radius:5px;letter-spacing:.03em}
  .b-live{background:rgba(52,211,153,.12);color:var(--good)} .b-pulled{background:rgba(240,109,109,.12);color:var(--bad)}
  .b-preview{background:rgba(245,185,69,.12);color:var(--warn)} .b-open{background:rgba(91,140,255,.12);color:#7ea6ff}
  .b-historic{background:rgba(154,163,178,.12);color:var(--ghost)} .b-milestone{background:rgba(245,185,69,.14);color:var(--warn)}

  /* timeline */
  .tl{position:relative;padding-left:20px;margin-top:6px}
  .tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line2)}
  .tnode{position:relative;margin-bottom:15px}
  .tnode::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--lab,var(--accent));box-shadow:0 0 0 4px var(--bg)}
  .tnode .yr{font:700 13.8px var(--mono);color:var(--accent)}
  .tnode .nm{font-size:18.1px;font-weight:720;margin-top:1px}
  .tnode .nm .lab{font:600 13.8px var(--sans);color:var(--ink3);margin-left:6px}
  .tnode .why{font-size:15.0px;color:var(--ink2);margin-top:3px;line-height:1.45}
  .showall{text-align:center;margin:6px 0 2px}
  .showall button{background:var(--panel);border:1px solid var(--line2);color:var(--accent);border-radius:999px;padding:8px 18px;font:650 15.6px var(--sans);cursor:pointer}

  /* accordion */
  details.acc{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
  details.acc>summary{cursor:pointer;padding:13px 15px;font-weight:720;font-size:18.1px;display:flex;align-items:center;gap:9px;list-style:none}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary .tw{transition:.2s;color:var(--ink3);font-size:13.8px}
  details.acc[open]>summary .tw{transform:rotate(90deg)}
  details.acc>summary .ct{margin-left:auto;font:600 13.8px var(--mono);color:var(--ink3)}
  details.acc .body{padding:0 13px 14px}
  .accsub{font-size:14.4px;color:var(--ink3);margin:-2px 0 10px;line-height:1.45}

  /* charts */
  .svgchart{display:block;width:100%;height:auto;overflow:visible}
  .svgchart text{font-family:var(--mono);fill:var(--ink3)}
  .svgchart .mn{font-family:var(--mono)}
  .chartcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 12px 10px;margin-bottom:11px}
  .chartcard h4{margin:0 0 2px;font-size:16.9px;font-weight:720;color:var(--ink)}
  .chartcard .cd{font-size:13.8px;color:var(--ink3);margin-bottom:8px;line-height:1.4}
  .lgd{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font:600 12.5px var(--mono);color:var(--ink3)}
  .lgd span{display:inline-flex;align-items:center;gap:5px}
  .swline{width:13px;height:0;border-top:2px solid var(--accent)} .swdash{width:13px;height:0;border-top:2px dashed var(--warn)}
  .swband{width:11px;height:8px;border-radius:2px;background:rgba(245,185,69,.2);border:1px solid rgba(245,185,69,.4)}
  .sattag{font:700 11.2px var(--mono);color:var(--ghost);background:rgba(154,163,178,.1);padding:2px 5px;border-radius:5px}
  .legend2{display:flex;flex-wrap:wrap;gap:9px 12px;margin-top:9px;font:600 12.5px var(--mono);color:var(--ink3)}
  .legend2 span{display:inline-flex;align-items:center;gap:5px}
  .legend2 .ld{width:9px;height:9px;border-radius:50%}
  .tdhint{font:600 13.1px var(--mono);color:var(--ink3);text-align:center;padding:9px;margin-top:10px;background:var(--bg);border:1px dashed var(--line2);border-radius:9px}
  .tdetail{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--lab,var(--accent));border-radius:9px;padding:10px 12px}
  .tdetail.pred{border-left-color:var(--warn);border-left-style:dashed}
  .td-top{display:flex;align-items:baseline;gap:8px}
  .td-nm{font-size:16.9px;font-weight:730}
  .td-sc{margin-left:auto;font:700 17.5px var(--mono);color:var(--accent)}
  .tdetail.pred .td-sc{color:var(--warn)}
  .td-meta{font:600 13.1px var(--mono);color:var(--ink3);margin-top:3px}
  .td-why{font-size:15.0px;color:var(--ink2);margin-top:6px;line-height:1.45}
  svg circle[data-model]:active,svg circle[data-pred]:active{r:6.5}
  .hh{width:100%;border-collapse:collapse;font-size:15.0px;min-width:320px}
  .hh th{text-align:right;font:700 12.5px var(--mono);color:var(--ink3);padding:5px 7px;border-bottom:1px solid var(--line2);text-transform:uppercase}
  .hh th:first-child{text-align:left}
  .hh td{text-align:right;padding:7px;border-bottom:1px solid var(--line);font-family:var(--mono);color:var(--ink)}
  .hh td:first-child{text-align:left;font-family:var(--sans);font-weight:650}
  .hh tr:last-child td{border-bottom:none}
  .hh .hhm{display:flex;align-items:center;gap:6px}
  .hh .hd{width:8px;height:8px;border-radius:50%;flex:none}
  .mktrow{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .mkt-top{display:flex;align-items:center;gap:8px}
  .mkt-plat{font:700 11.2px var(--mono);border:1px solid;border-radius:5px;padding:2px 6px;text-transform:uppercase}
  .mkt-fc{margin-left:auto;font:700 16.2px var(--mono);color:var(--ink)}
  .mkt-q{font-size:15.0px;color:var(--ink2);margin-top:6px;line-height:1.4}
  .mkt-d{font:600 12.5px var(--mono);color:var(--ink3);margin-left:auto}
  .mkt-go{margin-left:6px;color:var(--ink3);font-size:13.8px}
  .mkt-fc2{font:600 15.6px var(--mono);color:var(--ink);margin-top:6px;line-height:1.45;word-break:break-word}
  .mktrow.lnk{cursor:pointer;transition:border-color .15s,background .15s}
  .mktrow.lnk:hover,.mktrow.lnk:focus-visible{border-color:var(--ink3);background:var(--panel);outline:none}
  .subacc{border-left:2px solid var(--line);margin:8px 0 8px 1px}
  .subacc>summary{cursor:pointer;padding:7px 9px;font-weight:680;font-size:15.6px;display:flex;align-items:center;gap:7px;list-style:none;color:var(--ink2)}
  .subacc>summary::-webkit-details-marker{display:none}
  .subacc>summary .tw{transition:.2s;color:var(--ink3);font-size:12.5px}
  .subacc[open]>summary .tw{transform:rotate(90deg)}
  .subacc>summary .ct{margin-left:auto;font:600 12.5px var(--mono);color:var(--ink3)}
  .subbody{padding:2px 0 4px 11px}
  .mktstory p{font-size:16.2px;color:var(--ink);line-height:1.64;margin:0 0 11px}
  .mktstory p:last-child{margin-bottom:0}
  .mktstory p b{color:var(--accent);font-weight:700}
  .mktgrp-h{display:flex;align-items:center;font:700 13.1px var(--mono);letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin:15px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .mktgrp-h .ct{margin-left:auto;font-weight:600;color:var(--ink3)}
  .chartkey{font-size:13.1px;color:var(--ink3);margin-top:5px;line-height:1.4}
  .rebasenote{font-size:13.1px;color:#cf9a3d;background:rgba(207,154,61,.09);border:1px solid rgba(207,154,61,.26);border-radius:7px;padding:6px 8px;margin:6px 0 2px;line-height:1.42}
  .td-band{font:600 13.8px var(--mono);color:var(--ink3)}
  .td-src{font-size:13.1px;color:var(--ink3);margin-top:6px;line-height:1.4}
  .newsrow{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px}
  .newsrow.lnk{cursor:pointer;transition:border-color .15s,background .15s}
  .newsrow.lnk:hover,.newsrow.lnk:focus-visible{border-color:var(--ink3);background:var(--panel);outline:none}
  .news-top{display:flex;align-items:center;gap:8px}
  .news-src{font:700 11.2px var(--mono);border:1px solid;border-radius:5px;padding:2px 6px;text-transform:uppercase;letter-spacing:.3px}
  .news-topic{font:600 11.9px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
  .news-date{margin-left:auto;font:600 12.5px var(--mono);color:var(--ink3)}
  .news-title{font-size:16.9px;font-weight:680;color:var(--ink);margin-top:8px;line-height:1.38}
  .news-blurb{font-size:15.0px;color:var(--ink2);margin-top:5px;line-height:1.5}
  /* predict — frontier release radar */
  .phero{background:linear-gradient(135deg,color-mix(in srgb,var(--lab) 22%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--lab) 40%,var(--line));border-radius:13px;padding:13px 15px;margin-bottom:12px}
  .phero-k{font:700 12.5px var(--mono);letter-spacing:.5px;text-transform:uppercase;color:var(--lab)}
  .phero-m{font-size:23.8px;font-weight:760;color:var(--ink);margin-top:4px;display:flex;align-items:center;gap:8px}
  .phero-w{font-size:16.2px;color:var(--ink2);margin-top:3px}
  .phero-w b{color:var(--ink)}
  .phero-b{font-size:14.4px;color:var(--ink3);margin-top:6px;line-height:1.45}
  .relrow{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .relrow.fr{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 8%,transparent),transparent);border-left:2px solid var(--accent);padding:10px 9px;border-radius:0 9px 9px 0;margin:3px 0}
  .rel-dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
  .rel-main{flex:1;min-width:0}
  .rel-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .rel-name{font-size:17.5px;font-weight:700;color:var(--ink)}
  .fr-tag{font:700 10.0px var(--mono);letter-spacing:.4px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:4px;padding:1px 5px}
  .rel-when{margin-left:auto;font:600 13.8px var(--mono);color:var(--ink2)}
  .rel-sub{font-size:13.8px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:7px}
  .rel-noprob{font:600 13.1px var(--mono);color:var(--ink3);margin-top:6px}
  .rel-basis{font-size:13.8px;color:var(--ink3);margin-top:5px;line-height:1.45}
  .pbar{position:relative;height:16px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;margin-top:7px;overflow:hidden}
  .pbar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px 0 0 8px;opacity:.5}
  .pbar-n{position:absolute;right:7px;top:0;line-height:16px;font:700 12.5px var(--mono);color:var(--ink)}
  .reldet{font-size:15.0px;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-left:2px solid var(--lab);border-radius:8px;padding:8px 10px;line-height:1.5}
  .reldet b{color:var(--ink)}
  .reldet-b{margin-top:4px;color:var(--ink3)}
  .reldet-s{margin-top:4px;font-size:13.1px;color:var(--ink3)}
  .mkt-bar{height:5px;background:var(--bg);border-radius:3px;margin-top:8px;overflow:hidden}
  .mkt-bar-fill{height:100%;border-radius:3px;opacity:.72}
  /* glossary search (More) */
  .gsearch{width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:500 17.5px var(--sans);padding:10px 12px;margin-bottom:10px;outline:none}
  .gsearch:focus{border-color:var(--accent)}
  .gsearch::placeholder{color:var(--ink3)}
  .gterm{padding:10px 0;border-bottom:1px solid var(--line)}
  .gt-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .gt-term{font-size:16.9px;font-weight:700;color:var(--ink)}
  .gt-acr{font:700 12.5px var(--mono);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:4px;padding:1px 5px}
  .gt-cat{margin-left:auto;font:600 11.9px var(--mono);color:var(--ink3)}
  .gt-def{font-size:15.0px;color:var(--ink2);margin-top:4px;line-height:1.5}
  /* model info button + popup */
  .infobtn{display:inline-flex;align-items:center;gap:5px;margin-top:9px;background:var(--bg2);border:1px solid var(--line);color:var(--ink2);font:600 14.4px var(--sans);border-radius:8px;padding:5px 10px;cursor:pointer;transition:border-color .15s,color .15s}
  .infobtn:hover{border-color:var(--accent);color:var(--ink)}
  .infobtn svg{color:var(--accent)}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .modal[hidden]{display:none}
  .modal-bg{position:absolute;inset:0;background:rgba(4,6,11,.66);backdrop-filter:blur(2px)}
  .modal-card{position:relative;z-index:1;width:100%;max-width:540px;max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.5);animation:sheet .22s ease}
  @keyframes sheet{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
  .modal-x{position:absolute;top:13px;right:13px;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);color:var(--ink2);font-size:17.5px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mi-nm{font-size:23.8px;font-weight:760;color:var(--ink);padding-right:34px;line-height:1.25}
  .mi-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:15.0px;color:var(--ink2);margin-top:7px}
  .mi-meta .dot{width:8px;height:8px;border-radius:50%}
  .mi-brief{margin-top:12px}
  .mi-brief p{font-size:16.9px;color:var(--ink);line-height:1.62;margin:0 0 11px}
  .mi-brief p:last-child{margin-bottom:0}
  .mi-fallback{font-size:13.8px;color:var(--ink3);margin-top:10px;font-style:italic}
  /* tie popup — list of all tied models */
  .tiemodal-list{margin-top:14px}
  .tierow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tierow:last-child{border-bottom:none}
  .tierow .tdot{width:9px;height:9px;border-radius:50%;flex:none}
  .tierow .tnm{font-size:16.9px;font-weight:650;color:var(--ink)}
  .tierow .tlab{margin-left:auto;font:600 13.8px var(--mono);color:var(--ink3)}

  /* horizontal bar (head-to-head + weights) */
  .bar{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;margin-bottom:8px}
  .bar .bl{font-size:14.4px;color:var(--ink2);text-align:right;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{height:18px;background:var(--bg);border-radius:5px;overflow:hidden;position:relative;border:1px solid var(--line)}
  .bar .fill{height:100%;border-radius:4px}
  .bar .bv{font:700 14.4px var(--mono);color:var(--ink)}
  .ceil-tick{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed rgba(245,185,69,.6);z-index:3}
  .ceil-lab{font:700 12.5px var(--mono);color:var(--warn);margin:0 0 9px;display:flex;align-items:center;gap:7px}
  .ceil-lab::before{content:"";width:16px;border-top:2px dashed rgba(245,185,69,.6)}
  .wlabel{font:600 13.1px var(--mono);color:var(--ink2);white-space:nowrap}

  /* cadence stats */
  .cadstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 14px}
  .cadstat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .cadstat .v{font:780 22.5px var(--sans);color:var(--ink);line-height:1.1}
  .cadstat .v small{font-size:13.8px;color:var(--ink2);font-weight:600}
  .cadstat .l{font:600 13.1px var(--sans);color:var(--ink3);margin-top:4px;line-height:1.3}

  /* prediction gauge */
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .pcard .ptop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .pcard .pnm{font-size:18.1px;font-weight:730}
  .pcard .pbench{margin-left:auto;font:700 13.1px var(--mono);color:var(--accent)}
  .pcard .pmeta{font:600 13.1px var(--mono);color:var(--ink3);margin-top:2px}
  .pcard .basis{font-size:15.0px;color:var(--ink2);margin-top:8px;line-height:1.45}
  .gauge{margin-top:10px}
  .gauge .gtrack{position:relative;height:28px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .gauge .band{position:absolute;top:0;bottom:0;background:rgba(245,185,69,.16);border-left:1px solid rgba(245,185,69,.5);border-right:1px solid rgba(245,185,69,.5)}
  .gauge .pt{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--warn);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--panel)}
  .gauge .gv{position:absolute;top:-1px;transform:translateX(-50%);font:700 13.8px var(--mono);color:var(--warn)}
  .gauge .lbls{display:flex;justify-content:space-between;font:600 11.9px var(--mono);color:var(--ink3);margin-top:4px}
  .conf{font:700 11.2px var(--mono);padding:2px 6px;border-radius:5px}
  .conf.high{background:rgba(52,211,153,.12);color:var(--good)} .conf.medium{background:rgba(245,185,69,.12);color:var(--warn)} .conf.low{background:rgba(240,109,109,.12);color:var(--bad)}

  /* leaderboard */
  .lbrow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
  .lbrow.gold{border-color:rgba(245,185,69,.4);background:linear-gradient(100deg,rgba(245,185,69,.07),var(--bg2)),var(--bg2)}
  .lbrank{font:780 23.8px var(--mono);color:var(--ink3);text-align:center}
  .lbrow.gold .lbrank{color:var(--warn)}
  .lbname{font-weight:730;font-size:17.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .lbsub{font:600 13.1px var(--mono);color:var(--ink3);margin-top:2px}
  .lbscore{text-align:right;font:780 22.5px var(--mono);color:var(--ink)}
  .lbscore small{display:block;font:600 10.6px var(--mono);color:var(--ink3);letter-spacing:.05em}

  /* upcoming + killed rows */
  .hrow{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
  .hrow.rum{opacity:.82;border-style:dashed}
  .hname{font-size:16.9px;font-weight:720;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .hname .dot{width:8px;height:8px;border-radius:50%}
  .hwhat{font-size:15.0px;color:var(--ink2);line-height:1.45}
  .hpill{font:700 11.2px var(--mono);padding:2px 6px;border-radius:5px}
  .h-un{background:rgba(245,185,69,.12);color:var(--warn)} .h-soon{background:rgba(91,140,255,.12);color:#7ea6ff}
  .h-rum{background:rgba(154,163,178,.1);color:var(--ghost)}
  .kill{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
  .kill .x{color:var(--bad);font-weight:800;flex:none}
  .kclaim{font-size:15.6px;color:var(--ink);font-weight:600;margin-bottom:3px;line-height:1.4}
  .kmeta{font:600 13.1px var(--mono);color:var(--ink3)}
  .correction{background:linear-gradient(100deg,rgba(52,211,153,.09),var(--bg2));border:1px solid rgba(52,211,153,.3);border-left:3px solid var(--good);border-radius:11px;padding:11px 13px;font-size:15.0px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
  .correction b{color:var(--ink)}
  .src{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14.4px}
  .src:first-child{border-top:none}
  .src a{color:#8db4ff;word-break:break-all}
  .srclist{padding-top:3px!important}
  .srcrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14.4px;cursor:pointer}
  .srcrow:first-child{border-top:none}
  .srcu{flex:1;color:#8db4ff;word-break:break-all}
  .srcrow:hover .srcu{text-decoration:underline}
  .sq{font:700 10.6px var(--mono);padding:2px 5px;border-radius:4px;flex:none}
  .sq.primary{background:rgba(52,211,153,.13);color:var(--good)} .sq.secondary{background:rgba(91,140,255,.13);color:#7ea6ff} .sq.blog{background:rgba(154,163,178,.12);color:var(--ghost)}

  .note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.6px;color:var(--ink2);line-height:1.55;margin-bottom:10px}
  .note b{color:var(--ink)}
  .caveat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.4px;color:var(--ink3);line-height:1.5;margin-top:11px}
  .caveat b{color:var(--ink2)}
  .empty{text-align:center;color:var(--ink3);font-size:15.6px;padding:24px 10px}

  nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:30;
    display:flex;background:rgba(12,15,22,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);height:calc(var(--navh) + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:none;color:var(--ink3);font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:8px 1px;transition:color .15s}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button span{font-size:11.0px;font-weight:650;letter-spacing:-.1px}

  /* home */
  .hero{font-size:16.2px;color:var(--ink2);line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:13px}
  .hero b{color:var(--ink)}
  .hsec{font:700 13.8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:20px 0 10px}
  .bestgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bestcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;border-left:3px solid var(--lab,var(--accent))}
  .bclabel{font:600 13.1px var(--sans);color:var(--ink3)}
  .bcname{font-size:16.9px;font-weight:730;margin-top:3px;line-height:1.2}
  .bcval{font:700 14.4px var(--mono);color:var(--accent);margin-top:4px}
  .tiecard{cursor:pointer}
  .tiechev{color:var(--ink3);display:inline-block;transition:transform .2s;font-weight:700}
  .tiecard.exp{grid-column:1/-1}
  .tiecard.exp .tiechev{transform:rotate(90deg)}
  .tielist{display:none;flex-wrap:wrap;gap:5px;margin-top:9px}
  .tiecard.exp .tielist{display:flex}
  .tiechip{display:inline-flex;align-items:center;gap:5px;font-size:14.4px;font-weight:600;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
  .tiedot{width:7px;height:7px;border-radius:50%;flex:none}
  .explore{display:flex;flex-direction:column;gap:7px}
  .explore button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px;cursor:pointer;display:flex;align-items:baseline;gap:10px;color:var(--ink2);width:100%;font-family:var(--sans)}
  .explore button b{color:var(--ink);font-size:16.9px;min-width:58px}
  .explore button span{font-size:14.4px;color:var(--ink3)}
  .explore button::after{content:"›";margin-left:auto;color:var(--ink3);font-size:22.5px;align-self:center}

  /* ════════════════ FOREST / WOODLAND @ DUSK — restrained reskin (overrides above) ════════════════ */
  /* soft & rounded, warm-bordered cards with a gentle drop shadow (cozier than the original) */
  .chartcard,details.acc,.pcard,.phero,.lbrow,.mktrow,.newsrow,.hrow,.kill,.cadstat,.note,.caveat,
  .bestcard,.modal-card,.reldet,.tdetail,.correction{border-radius:16px}
  .chartcard,details.acc,.pcard,.lbrow{box-shadow:0 2px 12px rgba(0,0,0,.26);border-color:var(--line)}
  .lbrow:hover{box-shadow:0 4px 18px rgba(0,0,0,.34)}
  .infobtn,.showall button,.gsearch,.fchip,.seg,.badge,.hpill,.conf,.sq,.pbar,.mkt-bar{border-radius:10px}
  /* topographic contour backdrop behind charts (faint concentric rings = elevation map) */
  .chartcard{background-image:
    repeating-radial-gradient(circle at 22% 118%,rgba(98,193,119,.055) 0 1px,transparent 1px 18px),
    repeating-radial-gradient(circle at 86% -12%,rgba(143,182,143,.04) 0 1px,transparent 1px 22px);}
  /* recolor the bits that were hard-coded blue so nothing reads as the old theme */
  .b-open{background:rgba(98,193,119,.13)!important;color:var(--accent)!important}
  .seg button[data-mode="open"].on{color:#9fd9ad}
  .src a,.srcu{color:#8fd6a0!important}
  /* status pills + source-quality badge off old-blue → forest */
  .h-soon{background:rgba(98,193,119,.14);color:#9fd9ad}
  .sq.secondary{background:rgba(98,193,119,.13);color:#8fd6a0}
  .seg button.on{color:var(--ink)}
  .fchip.on{border-color:var(--accent);background:rgba(98,193,119,.12);color:var(--ink)}
  .gsearch:focus{border-color:var(--accent)}
  /* nav: soft forest glass + green active (no flashy motion) */
  nav.tabs{background:rgba(13,24,18,.93)}
  nav.tabs button.on{color:var(--accent)}
  /* section headers a touch warmer */
  .vh{color:var(--accent)}
  .hsec{color:var(--ink2)}
  #v-home .hero{margin-top:54px}   /* a band above the overview for the fox to walk on (keeps it clear of the OVERVIEW words) */
  /* the Frontier/Open toggle sits down near the leaderboard, away from the Pulse hero */
  #v-home .seg{margin-top:22px;margin-bottom:0}
  #v-home .seg + .hsec{margin-top:5px}
  /* ── living pixel fox: ambles along the TOP EDGE of the overview, sits at random ── */
  #fox{position:absolute;z-index:16;pointer-events:none;will-change:left,top;transition:opacity .3s ease}
  #fox.fox-off{opacity:0}
  .fox-img{display:block;height:48px;width:auto;image-rendering:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
  .fox-shadow{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);width:78%;height:6px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.4),transparent 72%)}
  /* ── file-cabinet sub-tabs (Current / Charts / Predict / News): active tab is stitched to the panel ── */
  /* ── section nav: editorial underline tabs (Fraunces), darkened to read on the light-sage bg ── */
  .ftabs{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;margin:6px 0 0;padding:0 1px;position:relative;z-index:2;
    border-bottom:1px solid rgba(40,70,52,.22);touch-action:pan-x;overscroll-behavior-x:contain}
  .ftabs::-webkit-scrollbar{display:none}
  .ftab{flex:none;-webkit-user-select:none;user-select:none;display:inline-flex;align-items:baseline;gap:6px;
    background:none;border:none;padding:6px 1px 11px;font:650 16.5px var(--display);letter-spacing:.2px;
    color:#33503c;cursor:pointer;white-space:nowrap;position:relative;transition:color .16s}
  .ftab:hover{color:#234829}
  .ftab.on{color:#15732f}
  .ftab .ftab-ct{font:650 12px var(--mono);color:#557a5d;font-feature-settings:"tnum";transition:color .16s}
  .ftab.on .ftab-ct{color:#15732f}
  /* active marker: a clean underline on the baseline with a soft grow-light glow */
  .ftab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:transparent;transition:background .16s}
  .ftab.on::after{background:#15732f;box-shadow:0 1px 7px rgba(21,115,47,.38)}
  .ftabs-fill{gap:13px}   /* ≤4 tabs: tighter so All + 3 broad News buckets fit without scrolling */
  /* ── opening splash: brand + "what changed since last visit" briefing ── */
  #splash{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:34px;
    background:radial-gradient(125% 95% at 50% 32%, #1d3527 0%, #122218 62%, #0a130e 100%);transition:opacity .5s ease,visibility .5s}
  #splash.gone{opacity:0;visibility:hidden;pointer-events:none}
  #splash .sp-leaf{width:78px;height:78px;filter:drop-shadow(0 5px 20px rgba(127,227,161,.35));animation:spLeaf 3.4s ease-in-out infinite}
  @keyframes spLeaf{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  #splash .sp-name{font:800 48px var(--display);color:#eef4ea;letter-spacing:-.01em;line-height:1}
  #splash .sp-tag{font-family:var(--display);font-style:italic;font-size:15.5px;color:#7fe3a1;line-height:1.3;max-width:300px}
  #splash .sp-bar{width:160px;height:3px;border-radius:3px;margin-top:26px;background:rgba(127,227,161,.13);overflow:hidden;opacity:0;transition:opacity .3s ease}
  #splash .sp-bar.show{opacity:1}
  #splash .sp-bar-fill{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left center;border-radius:3px;background:linear-gradient(90deg,#3a9e63,#7fe3a1);box-shadow:0 0 9px rgba(127,227,161,.5)}
  #splash .sp-bar.go .sp-bar-fill{animation:spLoad 1.5s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes spLoad{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){#splash .sp-leaf{animation:none}#splash .sp-bar.go .sp-bar-fill{animation:none;transform:scaleX(1)}}
  /* Compare button — lives on the Current tab eyebrow */
  .vh-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cmp-btn{flex:none;font:650 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:#15732f;
    background:rgba(21,115,47,.10);border:1px solid rgba(21,115,47,.30);border-radius:999px;padding:5px 12px;cursor:pointer;transition:background .15s}
  .cmp-btn:hover{background:rgba(21,115,47,.18)}
  .ftab-panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-top:11px;
    padding:15px 13px;position:relative;z-index:1;box-shadow:0 2px 12px rgba(0,0,0,.22)}
  /* charts/predict bodies inside a panel don't need their own card chrome */
  .ftab-panel .chartcard{border:none;background:none;padding:0;margin:0 0 6px;box-shadow:none}
  .ftab-panel .chartcard+.chartcard{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  /* ── Home "Pulse" — one dense living paragraph the two daily routines rewrite ── */
  .hero.pulse{padding:14px 16px}
  .pulse-txt{font-size:16.9px;line-height:1.64;color:var(--ink2)}
  .pulse-txt b{color:var(--ink);font-weight:700}
  .pulse-txt.clamp{max-height:calc(1.64em * 4);overflow:hidden;position:relative}
  .pulse-txt.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.95em;
    background:linear-gradient(to bottom,transparent,var(--panel) 86%);pointer-events:none}
  .pulse-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    margin-top:4px;padding:7px 0 2px;background:none;border:none;cursor:pointer;
    color:var(--accent);font:650 14.4px var(--sans);letter-spacing:.02em}
  .pulse-more[hidden]{display:none}
  .pulse-more .pm-caret{font-size:11px;line-height:1;transition:transform .18s}
  .pulse-more[aria-expanded="true"] .pm-caret{transform:rotate(180deg)}
  .pulse-meta{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);
    font:600 12.5px var(--mono);letter-spacing:.02em;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pulse-meta .pulse-dot{color:var(--accent);animation:pulseGlow 2.6s ease-in-out infinite}
  @keyframes pulseGlow{0%,100%{opacity:.5}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.pulse-meta .pulse-dot{animation:none}}
  /* More: glossary search is live + persistent at the top; terms aren't listed until you search */
  #v-more .gsearch{margin-top:4px}
  .gloss-hint{font-size:15.6px;color:var(--ink3);line-height:1.55;padding:18px 6px;text-align:center}
  .gloss-hint b{color:var(--ink2);font-family:var(--mono)}
  /* ── LIGHT SAGE BACKDROP: text that sits bare on the bg goes deep forest-green so it stays legible ── */
  .vh{color:#27492f}
  .hsec{color:#375a43}
  .vsub{color:#3c5a43}
  .gloss-hint{color:#456a4d}
  .gloss-hint b{color:#27492f}
  .empty{color:#456a4d}
  .vh-upd{color:#5c7d62;font-weight:400}
  /* Current tab: compact name-first rows; full detail lives in the Details popup */
  .mrow{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,background .12s}
  .mrow:hover,.mrow:focus-visible{border-color:var(--line2);background:var(--panel);outline:none}
  .mrow:active{background:var(--panel2)}
  .mrow-dot{width:9px;height:9px;border-radius:50%;flex:none;align-self:flex-start;margin-top:6px}
  .mrow-main{min-width:0;flex:1}
  .mrow-nm{font:700 17.5px var(--sans);color:var(--ink);line-height:1.22;overflow-wrap:anywhere}
  .mrow-sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:4px}
  .mrow-sub .badge{font-size:9.6px;padding:1px 5px}
  .mrow-labdt{font:500 13.4px var(--mono);color:var(--ink3)}
  .mrow-chev{color:var(--ghost);font-size:20px;line-height:1;flex:none;align-self:center}
  /* Details popup: raw data as clean labeled grids (Specs / Benchmarks) */
  .mi-sec{font:700 11.8px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
  .mi-grid{display:grid;grid-template-columns:max-content 1fr;gap:7px 18px;margin:0;align-items:baseline}
  .mi-grid dt{color:var(--ink3);font:500 14.8px var(--sans)}
  .mi-grid dd{margin:0;color:var(--ink);font:600 14.8px var(--sans);overflow-wrap:anywhere}
  .mi-bench2 dd{font-family:var(--mono);font-weight:700}
  .mi-u{color:var(--ink3);font-weight:400;font-size:.86em}

  /* ════ LIGHTER FOREST + CHARACTERFUL TYPE (project-wide) ════ */
  /* Fraunces serif at the personality moments — wordmark, specimen names, section/card titles. Body = Spline Sans, data = Spline Sans Mono. */
  .bar h1,.lbname,.mrow-nm,.news-title,.mi-nm,.pcard .pnm,.tnode .nm,.rel-name,.bcname,.gt-term,
  .phero-m,.chartcard h4,details.acc>summary{font-family:var(--display)}
  .bar h1{font-family:var(--display);font-weight:600;letter-spacing:0}
  .lbname,.mrow-nm,.news-title,.gt-term,.rel-name,.pcard .pnm,.tnode .nm,.bcname,.chartcard h4,details.acc>summary{font-weight:600}
  .mi-nm{font-weight:600;letter-spacing:0}
  /* bottom-nav glass lightened to match the softer cards */
  nav.tabs{background:rgba(28,46,35,.93)}
  /* More → glossary results render BARE on the light sage bg, so the light ink washed out → deep-forest text for legibility */
  #glossres .gt-term{color:#21452a}
  #glossres .gt-def{color:#2f4d39}
  #glossres .gt-cat{color:#587a5f}
  #glossres .accsub{color:#466850}
  /* News (>4 topics) scrolls; soft right-edge fade instead of a hard "Soc..." cut */
  .ftabs-scroll{-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
  /* More: Sources flows right under the glossary search and opens downward (extends the page) */
  /* model-to-model compare — discreet ★ by the Overview opens a popup */
  /* (model compare moved from the faint Overview ★ to a Compare button on the Current tab) */
  .cmp-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;margin:16px 0 10px}
  .cmp-sel{width:100%;min-width:0;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;color:var(--ink);font:600 14px var(--sans);padding:9px 6px;-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
  .cmp-vs{font:700 12px var(--mono);color:var(--ink3)}
  .cmp-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
  .cmp-row:last-child{border-bottom:none}
  .cmp-v{font:700 15.5px var(--mono);color:var(--ink2);text-align:center;overflow-wrap:anywhere}
  .cmp-v.cmp-win{color:var(--accent)}
  .cmp-l{font:600 11px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;text-align:center;min-width:72px}
  .cmp-foot{font:600 12px var(--mono);color:var(--ink3);margin-top:13px;text-align:center}
</style>
</head>
<body>

  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span>Home</span></button>
  <button data-v="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Current</span></button>

<script>
const LABV = {OpenAI:'--openai',Anthropic:'--anthropic',Google:'--google','Google DeepMind':'--google',DeepMind:'--google',xAI:'--xai',Mistral:'--mistral','Mistral AI':'--mistral',Alibaba:'--qwen','Alibaba (Qwen)':'--qwen',Qwen:'--qwen',NVIDIA:'--nvidia',Microsoft:'--microsoft','Microsoft + NVIDIA':'--microsoft',Moonshot:'--moonshot','Moonshot AI':'--moonshot',Meta:'--meta','Meta AI':'--meta','Meta Superintelligence Labs':'--meta',DeepSeek:'--deepseek',Zhipu:'--zhipu','Z.ai':'--zhipu','Zhipu / Z.ai':'--zhipu','Zhipu AI':'--zhipu'};
function labVar(l){ if(LABV[l]) return LABV[l]; const k=Object.keys(LABV).find(x=>l&&l.includes(x.split(' ')[0])); return k?LABV[k]:'--ghost'; }
const CANON={'--openai':'OpenAI','--anthropic':'Anthropic','--google':'Google','--xai':'xAI','--mistral':'Mistral','--qwen':'Alibaba','--nvidia':'NVIDIA','--microsoft':'Microsoft','--moonshot':'Moonshot','--meta':'Meta','--deepseek':'DeepSeek','--zhipu':'Zhipu'};
function canonLab(l){ return CANON[labVar(l)] || l; }
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const labHex = l => css(labVar(l)) || css('--ghost');
const esc = s => (s==null?'':String(s));
const he = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtPulse = s => he(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');   // **bold** key facts, everything else escaped

// ---- editorial sets — loaded from data/editorial.json in boot() (updater-maintained) ----
let PRICES={}, LB=[], LBMETA={source:'LLM-Stats'}, UPCOMING=[], KILLED=[], SOURCES=[], SWEEPS=[], PULSE={};

let DATA = {models:[],trends:[],predictions:[],meta:{}};

async function boot(){
  const J = f => fetch('data/'+f+'.json',{cache:'no-store'}).then(r=>r.json());   // network-fresh: data updates 4×/day
  try{
    const [m,t,p,meta] = await Promise.all([J('models'),J('trends'),J('predictions'),J('meta')]);
    DATA = {models:m.models||[], trends:t.trends||[], predictions:p.predictions||[], methodology:p.methodology||'', meta};
  }catch(e){ console.error(e); }
  const [fc,ed,nw,gl,rl,bf,sj] = await Promise.all([
    J('forecasts').catch(e=>(console.warn('forecasts',e),{})),
    J('editorial').catch(e=>(console.warn('editorial',e),{})),
    J('news').catch(e=>(console.warn('news',e),{})),
    J('glossary').catch(e=>(console.warn('glossary',e),{})),
    J('releases').catch(e=>(console.warn('releases',e),{})),
    J('briefs').catch(e=>(console.warn('briefs',e),{})),
    J('sources').catch(e=>(console.warn('sources',e),{})),
  ]);
  MARKETS=fc.markets||[]; HISTORICS=fc.historics||[]; TRAJFC=fc.trajForecasts||[]; FCMETHOD=fc.methodology||''; FCSTORY=fc.marketsStory||[];
  PRICES=ed.prices||{}; LB=(ed.leaderboard&&ed.leaderboard.rows)||[]; LBMETA=ed.leaderboard||LBMETA; UPCOMING=ed.upcoming||[]; KILLED=ed.killed||[]; SOURCES=ed.sources||[]; PULSE=ed.pulse||{};
  NEWS=nw.items||[]; NEWSMETA=nw||{};
  GLOSSARY=gl.terms||[]; RELEASES=rl.items||[]; RELMETA=rl||{}; BRIEFS=bf.briefs||{}; SWEEPS=sj.sweeps||[];
  renderUpd(); renderHome(); renderNow(); renderCharts(); renderPredict(); renderNews(); renderMore();
  runSplash();
}
// ---- opening splash: branded loading screen (leaf + Botany + tagline + a fake loading bar) ----
function dismissSplash(){ const s=$('#splash'); if(s) s.classList.add('gone'); }
function runSplash(){
  const s=$('#splash'); if(!s) return;
  const bar=$('#sp-bar'); if(bar){ bar.classList.add('show'); requestAnimationFrame(()=>bar.classList.add('go')); }
  const t=setTimeout(dismissSplash, 1900);
  s.addEventListener('click',()=>{clearTimeout(t);dismissSplash();},{once:true});
}
setTimeout(()=>{try{dismissSplash();}catch(e){}}, 6000);   // hard backstop: never let the splash stick

function renderUpd(){
  const m=DATA.meta||{}, d=m.lastUpdated?new Date(m.lastUpdated):null;
  const u=$('#upd'); if(u) u.innerHTML = `<b>●</b> updated ${d?timeAgo(d):'—'}<br>${m.models||DATA.models.length} models · ${m.sweeps||0} sweeps`;
}
function timeAgo(d){const s=(Date.now()-d.getTime())/1000;if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
const MM=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => { if(!s)return''; const p=s.split('-'); return p[2]?`${MM[+p[1]]} ${+p[2]}, ${p[0]}`:`${MM[+p[1]]||''} ${p[0]}`; };
const yr = s => (s||'').slice(0,4);
function priceFor(name){ const k=(name||'').toLowerCase(); return PRICES[k] || Object.entries(PRICES).find(([kk])=>k.includes(kk))?.[1]; }
function statusBadge(s){const m={live:'b-live',pulled:'b-pulled',preview:'b-preview',historic:'b-historic'}[s];return m?`<span class="badge ${m}">${s.toUpperCase()}</span>`:'';}

// ---------------- HOME ----------------
let homeMode='frontier';
function segCtl(seg,mode,opts){return `<div class="seg" data-seg="${seg}">${opts.map(o=>`<button data-mode="${o[0]}" class="${mode===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`;}
const FO=[['frontier','Frontier'],['open','Open source']];
function benchOf(m,cat){const b=m.benchmarks||{},ks=Object.keys(b);
  const re={aa:/aa[ -]?index|intelligence index/i,swe:/swe[ -]?bench/i,gpqa:/gpqa/i,aime:/aime/i}[cat];
  if(!re)return null;
  const vals=ks.filter(k=>re.test(k)).map(k=>b[k]).filter(v=>typeof v==='number');
  return vals.length?Math.max(...vals):null;}
function ctxNum(s){if(!s)return 0;const m=(''+s).match(/([\d.]+)\s*([KMT])?/i);if(!m)return 0;let v=+m[1];const u=(m[2]||'').toUpperCase();if(u==='K')v*=1e3;if(u==='M')v*=1e6;if(u==='T')v*=1e9;return v;}
function outPrice(name){const p=priceFor(name);return p?+p.split('/')[1]:null;}
const USECASES=[{label:'Top overall',cat:'aa',suf:''},{label:'Coding',cat:'swe',suf:'%'},{label:'Science · GPQA',cat:'gpqa',suf:'%'},{label:'Math · AIME',cat:'aime',suf:'%'},{label:'Longest context',cat:'context'},{label:'Best value',cat:'value'}];
function pickBest(cands,uc){
  const byRecent=(a,b)=>(b.released||'').localeCompare(a.released||'');
  if(uc.cat==='context'){
    let bv=0; cands.forEach(m=>{const v=ctxNum(m.context); if(v>bv)bv=v;});
    if(!bv)return null;
    const models=cands.filter(m=>ctxNum(m.context)===bv).sort(byRecent);
    return {models, disp:(models[0].context||'').replace(/\s*[\(/].*$/,'').trim()+' ctx'};
  }
  if(uc.cat==='value'){
    const sc=m=>{const aa=benchOf(m,'aa'),p=outPrice(m.name); return (aa&&p)?aa/p:null;};
    let bs=-1; cands.forEach(m=>{const s=sc(m); if(s!=null&&s>bs)bs=s;});
    if(bs<0)return null;
    const models=cands.filter(m=>{const s=sc(m); return s!=null&&Math.abs(s-bs)<1e-9;}).sort(byRecent);
    return {models, disp:'$'+outPrice(models[0].name)+'/M'};
  }
  let bv=-1; cands.forEach(m=>{const v=benchOf(m,uc.cat); if(v!=null&&v>bv)bv=v;});
  if(bv<0)return null;
  const models=cands.filter(m=>benchOf(m,uc.cat)===bv).sort(byRecent);
  return {models, disp:bv+(uc.suf||'')};
}
let TIEMAP={};
function bestCard(o){
  const ms=o.p.models, tie=ms.length>1;
  if(!tie){ const m=ms[0]; return `<div class="bestcard" style="--lab:${labHex(m.lab)}"><div class="bclabel">${o.uc.label}</div><div class="bcname">${he(m.name)}</div><div class="bcval">${he(o.p.disp)}</div></div>`; }
  TIEMAP[o.uc.label]={label:o.uc.label, disp:o.p.disp, models:ms};
  return `<div class="bestcard tiecard" style="--lab:var(--accent)" data-tie="${he(o.uc.label)}" role="button" tabindex="0"><div class="bclabel">${o.uc.label}</div><div class="bcname">${ms.length}-way tie <span class="tiechev">›</span></div><div class="bcval">${he(o.p.disp)}</div></div>`;
}
function tieInfo(t){
  const rows=t.models.map(m=>`<div class="tierow"><span class="tdot" style="background:${labHex(m.lab)}"></span><span class="tnm">${he(m.name)}</span><span class="tlab">${he(m.lab)}</span></div>`).join('');
  return `<button class="modal-x" aria-label="Close">✕</button>
    <div class="mi-nm">${he(t.label)}</div>
    <div class="mi-meta"><b>${t.models.length}-way tie</b> · <span style="color:var(--accent)">${he(t.disp)}</span></div>
    <div class="tiemodal-list">${rows}</div>`;
}
function openTieModal(t){ if(!t)return; $('#modalcard').innerHTML=tieInfo(t); $('#modal').hidden=false; document.body.style.overflow='hidden'; $('#modalcard').scrollTop=0; }
function renderHome(){
  const meta=DATA.meta||{};
  const updAgo=meta.lastUpdated?timeAgo(new Date(meta.lastUpdated)):'';
  let cands=DATA.models.filter(x=>x.status==='live');
  cands=cands.filter(x=> homeMode==='open'?x.open:!x.open);
  const lb=cands.map(x=>({x,aa:benchOf(x,'aa')})).filter(o=>o.aa!=null).sort((a,b)=>b.aa-a.aa).slice(0,5);
  const picks=USECASES.map(uc=>({uc,p:pickBest(cands,uc)})).filter(o=>o.p);
  TIEMAP={};   // rebuilt as bestCard() renders each tie
  const top=lb[0];
  const pulseTxt = (PULSE&&PULSE.text)?PULSE.text:'';
  const heroHTML = pulseTxt
    ? `<div class="hero pulse"><div class="pulse-txt clamp">${fmtPulse(pulseTxt)}</div><button class="pulse-more" data-pulse-toggle aria-expanded="false"><span class="pm-label">Read more</span><span class="pm-caret">▼</span></button></div>`
    : `<div class="hero"><b>${cands.length}</b> ${homeMode==='open'?'open-source':'frontier'} models available right now. The leader sits at <b>${top?top.aa+' AA-Index':'—'}</b>${top?' ('+top.x.name+')':''}. Updated ${meta.lastUpdated?timeAgo(new Date(meta.lastUpdated)):'—'} · ${meta.models||DATA.models.length} tracked all-time.</div>`;
  $('#v-home').innerHTML=`<div class="vh">Overview${updAgo?`<span class="vh-upd"> · updated ${updAgo}</span>`:''}</div>
    ${heroHTML}
    ${segCtl('home',homeMode,FO)}
    <div class="hsec">Leaderboard · AA Index</div>
    ${lb.length?lb.map((o,i)=>`<div class="lbrow ${i===0?'gold':''}"><div class="lbrank">${i+1}</div><div><div class="lbname"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${labHex(o.x.lab)}"></span>${o.x.name}${o.x.open?' <span class="badge b-open" style="font-size:10.0px;padding:1px 4px">OPEN</span>':''}</div><div class="lbsub">${o.x.lab}</div></div><div class="lbscore">${o.aa}<small>AA-INDEX</small></div></div>`).join(''):'<div class="empty">No AA-Index data for that filter — try All models.</div>'}
    <div class="hsec">Best model for…</div>
    <div class="bestgrid">${picks.map(bestCard).join('')||'<div class="empty">—</div>'}</div>`;
  // Pulse clamp: only offer "Read more" when the brief actually overflows 4 lines
  const ptx=$('#v-home .pulse-txt'), pmore=$('#v-home .pulse-more');
  if(ptx&&pmore&&ptx.scrollHeight<=ptx.clientHeight+2){ ptx.classList.remove('clamp'); pmore.hidden=true; }
}

// ---------------- NOW ----------------
function modelCard(m){
  // Current tab = a clean name-first list; the full breakdown (specs, all benchmarks, brief)
  // lives in the Details popup (modelInfo). Tap anywhere on the row to open it.
  const flag = (m.status && m.status!=='live') ? statusBadge(m.status) : '';   // only flag non-live (preview/pulled); LIVE stays clean
  const openTag = m.open ? '<span class="badge b-open">OPEN</span>' : '';
  const nm=he(m.name).replace(/"/g,'&quot;');   // he() escapes &<> ; also escape " for the attributes (matches the .lnk[data-href] convention)
  return `<div class="mrow" data-info="${nm}" role="button" tabindex="0" aria-label="${nm} — details">
    <span class="mrow-dot" style="background:${labHex(m.lab)}"></span>
    <div class="mrow-main">
      <div class="mrow-nm">${he(m.name)}</div>
      <div class="mrow-sub">${flag}${openTag}<span class="mrow-labdt">${he(m.lab)} · ${fmtDate(m.released)}</span></div>
    </div>
    <span class="mrow-chev">›</span>
  </div>`;
}
function synthBrief(m){
  const b=m.benchmarks||{}, pr=priceFor(m.name), bits=[];
  bits.push(`${m.name} is ${m.open?'an open-weight':'a'} ${m.modality?m.modality.split(',')[0].trim()+' ':''}model from ${m.lab}${m.released?`, released ${fmtDate(m.released)}`:''}.`);
  const bench=Object.entries(b).slice(0,4).map(([k,v])=>`${k.replace(/\s*\(.*\)/,'')} ${v}`);
  if(bench.length) bits.push(`Reported scores include ${bench.join(', ')}.`);
  const tail=[];
  if(m.params&&m.params!=='—') tail.push(`${m.params} parameters`);
  if(m.context&&m.context!=='—') tail.push(`a ${m.context} context window`);
  if(pr) tail.push(`pricing of $${pr} per million tokens`);
  if(tail.length) bits.push(`It has ${tail.join(', ')}.`);
  if(m.notable) bits.push(m.notable);
  return bits.join(' ');
}
function modelInfo(m){
  const b=m.benchmarks||{}, pr=priceFor(m.name);
  const brief=(BRIEFS[m.name]||synthBrief(m)).split(/\n\n+/).map(p=>`<p>${he(p)}</p>`).join('');
  const ok=v=>v&&v!=='—'&&v!=='unknown';
  // pricing: "in/out" -> "$in in · $out out / 1M"
  let price='';
  if(pr){ const x=String(pr).split('/'); price = x.length===2 ? `$${he(x[0].trim())} in · $${he(x[1].trim())} out <span class="mi-u">/ 1M tok</span>` : `$${he(pr)}`; }
  const specRows=[
    ['Parameters', ok(m.params)?he(m.params):''],
    ['Context', ok(m.context)?he(m.context):''],
    ['Pricing', price],
    ['Modality', m.modality?he(m.modality):''],
    ['License', m.open?'Open weights':'Proprietary'],
  ].filter(r=>r[1]);
  const specsHTML = specRows.length?`<div class="mi-sec">Specs</div><dl class="mi-grid">${specRows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`:'';
  const be=Object.entries(b);
  const benchHTML = be.length?`<div class="mi-sec">Benchmarks</div><dl class="mi-grid mi-bench2">${be.map(([k,v])=>`<dt>${he(k.replace(/\s*\(.*\)/,''))}</dt><dd>${he(String(v))}</dd>`).join('')}</dl>`:'';
  return `<button class="modal-x" aria-label="Close">✕</button>
    <div class="mi-nm">${he(m.name)}</div>
    <div class="mi-meta"><span class="dot" style="background:${labHex(m.lab)}"></span>${he(m.lab)} · ${fmtDate(m.released)} ${statusBadge(m.status)}${m.open?' <span class="badge b-open">OPEN</span>':''}</div>
    ${specsHTML}
    ${benchHTML}
    <div class="mi-sec">About</div>
    <div class="mi-brief">${brief}</div>${BRIEFS[m.name]?'':'<div class="mi-fallback">Quick summary from the model\'s data — a fuller write-up lands on the next sync.</div>'}`;
}
function openModal(name){
  const m=DATA.models.find(x=>x.name===name); if(!m)return;
  $('#modalcard').innerHTML=modelInfo(m);
  $('#modal').hidden=false; document.body.style.overflow='hidden'; $('#modalcard').scrollTop=0;
}
function closeModal(){ const md=$('#modal'); if(md&&!md.hidden){ md.hidden=true; document.body.style.overflow=''; } }
// ---- model-to-model compare (opens from the discreet ★ by the Overview) ----
let cmpA=null, cmpB=null;
function cmpModels(){ return DATA.models.filter(m=>m.status==='live').sort((a,b)=>(benchOf(b,'aa')||0)-(benchOf(a,'aa')||0)); }
function cmpNum(x,y){ return (x==null||y==null)?0:(x>y?1:x<y?-1:0); }
function cmpRow(label,av,bv,better){ return `<div class="cmp-row"><div class="cmp-v${better>0?' cmp-win':''}">${av}</div><div class="cmp-l">${label}</div><div class="cmp-v${better<0?' cmp-win':''}">${bv}</div></div>`; }
function cmpResult(){
  const a=DATA.models.find(m=>m.name===cmpA), b=DATA.models.find(m=>m.name===cmpB);
  if(!a||!b) return '<div class="empty">Pick two models.</div>';
  const v=(x,suf)=>x==null?'—':x+(suf||'');
  let s='';
  [['AA-Index','aa',''],['SWE-bench','swe','%'],['GPQA','gpqa','%'],['AIME','aime','%']].forEach(([lbl,cat,suf])=>{const av=benchOf(a,cat),bv=benchOf(b,cat);s+=cmpRow(lbl,v(av,suf),v(bv,suf),cmpNum(av,bv));});
  s+=cmpRow('Lab', he(canonLab(a.lab)), he(canonLab(b.lab)), 0);
  s+=cmpRow('Context', he(a.context||'—'), he(b.context||'—'), cmpNum(ctxNum(a.context),ctxNum(b.context)));
  const pa=outPrice(a.name),pb=outPrice(b.name);

// ---------------- PREDICT (per-company trajectories + forecasts combined) ----------------
let trajMode={aa:'frontier',swe:'frontier'};
// Back-estimated history is only comparable when the benchmark hasn't been re-scaled.
// AA Index was re-versioned in 2026 (frontier compressed from ~70 to high-50s/low-60s), so its
// pre-rebase historics sit ABOVE today's live values — this guard auto-detects that and drops them.
// SWE-bench is stable, so its historics pass and extend the lines back to 2023. Self-correcting:
// if a future sweep re-bases the historics onto the live scale, they start passing automatically.
function historicsUsable(cat){
  const hv=HISTORICS.filter(h=>h.benchmark===cat).map(h=>h.value).filter(v=>typeof v==='number');
  if(!hv.length) return false;
  let lmax=-Infinity; DATA.models.forEach(m=>{const v=benchOf(m,cat); if(v!=null&&v>lmax)lmax=v;});
  if(lmax===-Infinity) return true;
  return Math.max(...hv) <= lmax*1.03;
}
const WINDOW_MONTHS=18;
function windowCut(){ const d=new Date(); return d.getFullYear()+(d.getMonth()+Math.min(1,d.getDate()/30))/12 - WINDOW_MONTHS/12; }
function leadingTrajectory(cands,cat){
  const cut=windowCut();   // only the last 18 months of releases
  const byLab={};
  cands.forEach(m=>{const v=benchOf(m,cat);if(v==null||!m.released)return;const t=tval(m.released);if(t<cut)return;const L=canonLab(m.lab);(byLab[L]=byLab[L]||[]).push({t,date:m.released,v,model:m.name});});
  // extend the lines back with back-estimated points (only when scale-continuous AND inside the window)
  if(historicsUsable(cat)){
    Object.keys(byLab).forEach(L=>{
      HISTORICS.filter(h=>h.benchmark===cat && canonLab(h.lab)===L).forEach(h=>{
        const t=tval(h.date); if(t<cut)return;
        byLab[L].push({t,date:h.date,v:h.value,model:h.model,est:true});
      });
    });
  }
  const series=[];
  Object.entries(byLab).forEach(([lab,pts])=>{
    pts.sort((a,b)=>a.t-b.t || (b.v-a.v));
    // frontier over time, but KEEP models that MATCH the running best (so flagships that tie — e.g.
    // GPT-5.5 == GPT-5.4 — still show), while dropping lower-tier follow-ons (Sonnet/Haiku/Flash after
    // a higher flagship) so the line never fakes a regression.
    let best=-Infinity; const lead=[];
    pts.forEach(p=>{ if(p.v>=best-0.001){ lead.push(p); if(p.v>best) best=p.v; } });
    if(lead.length) series.push({lab,points:lead});
  });
  return series.sort((a,b)=>b.points[b.points.length-1].v-a.points[a.points.length-1].v);
}
function multiLineChart(series,cat){
  if(!series.length)return '<div class="empty">No data for that filter.</div>';
  const C={line:css('--line'),ink3:css('--ink3'),bg:css('--bg')};
  const allP=series.flatMap(s=>s.points.map(p=>({t:p.t,v:p.v})));
  let x0=Math.min(...allP.map(p=>p.t)),x1=Math.max(...allP.map(p=>p.t));if(x1-x0<0.3)x1=x0+0.4;
  let y0=Math.min(...allP.map(p=>p.v)),y1=Math.max(...allP.map(p=>p.v));const pad=(y1-y0)*.12||4;y0-=pad;y1+=pad;
  const W=500,H=250,L=34,R=12,T=12,B=26;
  const X=t=>L+((t-x0)/(x1-x0))*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let s=`<svg class="svgchart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  for(let i=0;i<=3;i++){const yy=y0+(y1-y0)*i/3,py=Y(yy).toFixed(1);s+=`<line x1="${L}" y1="${py}" x2="${W-R}" y2="${py}" stroke="${C.line}" opacity=".5"/><text x="${L-4}" y="${(+py+3).toFixed(1)}" font-size="9" text-anchor="end" fill="${C.ink3}">${yy.toFixed(0)}</text>`;}
  for(let q=Math.ceil(x0*4)/4;q<=x1+1e-6;q+=0.25){if(q<x0-1e-6)continue;const yr=Math.floor(q+1e-6),qq=Math.round((q-yr)*4)+1;s+=`<text x="${X(q).toFixed(1)}" y="${H-6}" font-size="8.5" text-anchor="middle" fill="${C.ink3}">Q${qq} ’${(''+yr).slice(2)}</text>`;}
  let anyEst=false;
  series.forEach(se=>{const col=labHex(se.lab);
    s+=`<polyline points="${se.points.map(p=>`${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>`;
    se.points.forEach(p=>{if(p.est)anyEst=true;
      const dot=p.est
        ?`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="${C.bg}" stroke="${col}" stroke-width="1.6" data-model="${p.model.replace(/"/g,'&quot;')}" data-bench="${cat}" style="cursor:pointer"><title>${p.model}: ~${p.v} (back-estimate)</title></circle>`
        :`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="${col}" stroke="${C.bg}" stroke-width="1.5" data-model="${p.model.replace(/"/g,'&quot;')}" data-bench="${cat}" style="cursor:pointer"><title>${p.model}: ${p.v}</title></circle>`;
      s+=dot;});});
  s+='</svg>';
  const key=anyEst?'hollow dot = back-estimated onto today\'s scale':'';
  return s+`<div class="legend2">${series.map(se=>`<span><span class="ld" style="background:${labHex(se.lab)}"></span>${se.lab.split(' ')[0]}</span>`).join('')}</div>${key?`<div class="chartkey">${key}</div>`:''}`;
}
function trajDetailCard(m,cat){const v=benchOf(m,cat);return `<div class="tdetail" style="--lab:${labHex(m.lab)}"><div class="td-top"><span class="td-nm">${m.name}</span><span class="td-sc">${v}${cat==='aa'?'':'%'}</span></div><div class="td-meta">${m.lab} · ${fmtDate(m.released)} ${statusBadge(m.status)}${m.open?' <span class="badge b-open">OPEN</span>':''}</div>${m.notable?`<div class="td-why">${m.notable}</div>`:''}</div>`;}
function trajBlock(cat,title,sub){
  let cands=DATA.models.filter(x=>x.status!=='preview');
  cands=cands.filter(x=> trajMode[cat]==='open'?x.open:!x.open);
  const hasHist=HISTORICS.some(h=>h.benchmark===cat);
  const histNote = (hasHist && !historicsUsable(cat))
    ? `<div class="rebasenote">${cat==='aa'?'AA Index was re-versioned in 2026 — pre-rebase scores aren\'t comparable, so this covers only the current-scale era.':'Pre-rebase history hidden — the benchmark scale changed.'}</div>` : '';
  return `<div class="chartcard"><h4>${title}</h4><div class="cd">${sub}</div>${histNote}
    ${segCtl('traj-'+cat,trajMode[cat],FO)}
    ${multiLineChart(leadingTrajectory(cands,cat),cat)}
    <div id="detail-${cat}"></div></div>`;
}

// ---------------- glossary (definitions & acronyms — searched in More) ----------------
function glossRow(t){
  return `<div class="gterm"><div class="gt-top"><span class="gt-term">${he(t.term)}</span>${t.acronym?`<span class="gt-acr">${he(t.acronym)}</span>`:''}${t.category?`<span class="gt-cat">${he((t.category).replace(/ &.*/,'').replace(/ \(.*/,''))}</span>`:''}</div><div class="gt-def">${he(t.def)}</div></div>`;
}
function glossMatch(t,q){
  if(!q) return true;
  const hay=(t.term+' '+(t.acronym||'')+' '+(t.def||'')+' '+((t.aka||[]).join(' '))).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function glossResults(q){
  const all=GLOSSARY||[];
  if(!all.length) return '<div class="empty">The glossary is being written — it lands on the next data sync.</div>';
  // terms live on the backend (glossary.json) — they are NOT listed up front; you search to surface them
  if(!q) return `<div class="gloss-hint">Type a word or acronym to search <b>${all.length}</b> AI terms — MMLU, MoE, RLHF, context window, quantization…</div>`;
  const hits=all.filter(t=>glossMatch(t,q));
  if(!hits.length) return `<div class="empty">No term matches “${he(q)}”.</div>`;
  return `<div class="accsub" style="margin:0 0 8px">${hits.length} match${hits.length>1?'es':''}</div>` + hits.map(glossRow).join('');
}

// ---------------- MORE ----------------
const SDOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function sParseD(s){ const p=(s||'').split('-').map(Number); return new Date(p[0]||2026,(p[1]||1)-1,p[2]||1); }
function sWeekKey(dateStr){ const d=sParseD(dateStr); d.setDate(d.getDate()-d.getDay()); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function sWeekLabel(k){ const a=sParseD(k), b=new Date(a); b.setDate(b.getDate()+6); return `Week of ${MM[a.getMonth()+1]} ${a.getDate()} – ${a.getMonth()===b.getMonth()?'':MM[b.getMonth()+1]+' '}${b.getDate()}`; }
function sDayLabel(dateStr){ const d=sParseD(dateStr); return `${SDOW[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`; }
function sSweepLabel(s){ const d=sParseD(s.date), r=s.routine||'Build'; return `${d.getMonth()+1}/${d.getDate()} ${r} Sources`; }
function srcRow(s){ const url=s.url||('https://'+(''+(s.u||'')).replace(/\s*\(.*$/,'').split(/\s/)[0]); return `<div class="srcrow lnk" data-href="${he(url).replace(/"/g,'&quot;')}">${s.q?`<span class="sq ${s.q}">${he((''+s.q).slice(0,4).toUpperCase())}</span>`:''}<span class="srcu">${he(s.u||url)}</span><span class="mkt-go"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M4 10 10 4"/><path d="M5.5 4H10V8.5"/></svg></span></div>`; }
function renderSources(){
  if(!SWEEPS.length) return '<div class="empty">No source sweeps logged yet — they accrue as the research runs (4×/day).</div>';
  const RORD={'9PM':4,'3PM':3,'9AM':2,'3AM':1,'PM':3,'AM':1};   // newest-first within a day; legacy AM/PM still sort
  const rr=s=>RORD[s.routine]||0;
  const sw=[...SWEEPS].sort((a,b)=> b.date.localeCompare(a.date) || rr(b)-rr(a));
  const weeks=[];
  sw.forEach(s=>{ const wk=sWeekKey(s.date); let W=weeks.find(w=>w.key===wk); if(!W){W={key:wk,days:[],n:0};weeks.push(W);} let D=W.days.find(d=>d.date===s.date); if(!D){D={date:s.date,sweeps:[],n:0};W.days.push(D);} D.sweeps.push(s); const c=(s.sources||[]).length; D.n+=c; W.n+=c; });
  let out='';
  weeks.forEach((W,wi)=>{
    out+=`<details class="subacc"><summary><span class="tw"><svg viewBox="0 0 12 12" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M4 2.5 8.5 6 4 9.5"/></svg></span>${sWeekLabel(W.key)}<span class="ct">${W.n}</span></summary><div class="subbody">`;
    W.days.forEach((D,di)=>{
      out+=`<details class="subacc"><summary><span class="tw"><svg viewBox="0 0 12 12" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M4 2.5 8.5 6 4 9.5"/></svg></span>${sDayLabel(D.date)}<span class="ct">${D.n}</span></summary><div class="subbody">`;
      D.sweeps.forEach((s,si)=>{
        out+=`<details class="subacc"><summary><span class="tw"><svg viewBox="0 0 12 12" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M4 2.5 8.5 6 4 9.5"/></svg></span>${sSweepLabel(s)}<span class="ct">${(s.sources||[]).length}</span></summary><div class="subbody srclist">${(s.sources||[]).map(srcRow).join('')}</div></details>`;
      });
      out+=`</div></details>`;
    });
    out+=`</div></details>`;
  });
  return out;
}
function renderMore(){
  const totalSrc=SWEEPS.reduce((n,s)=>n+((s.sources||[]).length),0);
  $('#v-more').innerHTML = `<div class="vh">Definitions &amp; acronyms</div>
    <input id="glossq" class="gsearch" type="search" placeholder="Search terms &amp; acronyms — MMLU, MoE, RLHF…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="glossres" class="glist">${glossResults('')}</div>
    <details class="acc more-sources"><summary><span class="tw"><svg viewBox="0 0 12 12" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M4 2.5 8.5 6 4 9.5"/></svg></span>Sources<span class="ct">${totalSrc||'…'}</span></summary>
      <div class="body"><div class="accsub">Every source the research consulted, logged per sweep (4×/day) — newest first. Sources roll up by sweep slot, then day, then week.</div>${renderSources()}</div></details>`;
}

  const cmp=e.target.closest('[data-compare]'); if(cmp){openCompare();return;}
  const sg=e.target.closest('.seg button[data-mode]'); if(sg){const which=sg.closest('.seg').dataset.seg,mode=sg.dataset.mode; if(which==='home'){homeMode=mode;renderHome();} else if(which==='now'){nowCat=mode;renderNow();} else if(which==='traj-aa'){trajMode.aa=mode;const w=$('#traj-aa-wrap');if(w)w.innerHTML=trajWrap('aa');else renderCharts();} else if(which==='traj-swe'){trajMode.swe=mode;const w=$('#traj-swe-wrap');if(w)w.innerHTML=trajWrap('swe');else renderCharts();} else if(which==='hh'){hhMetric=mode;const w=$('#hh-wrap');if(w)w.innerHTML=headToHead();else renderCharts();} else if(which==='cadence'){cadenceMode=mode;const w=$('#cadence-wrap');if(w)w.innerHTML=cadenceBlock();else renderCharts();} return;}
  const f=e.target.closest('.fchip'); if(f){ if(f.dataset.newsTopic!==undefined){newsTopic=f.dataset.newsTopic||null;renderNews();} return;}
  const ftb=e.target.closest('.ftab'); if(ftb){ const i=ftb.dataset.ftab.indexOf(':'),v=ftb.dataset.ftab.slice(0,i),val=ftb.dataset.ftab.slice(i+1);
    if(v==='now'){nowCat=val;renderNow();} else if(v==='charts'){chartsTab=val;renderCharts();}
    else if(v==='predict'){predictTab=val;renderPredict();} else if(v==='news'){newsTopic=(val==='all'?null:val);renderNews();}
    return; }
  const pm=e.target.closest('[data-pulse-toggle]'); if(pm){ const tx=pm.parentElement.querySelector('.pulse-txt'); if(tx){ const expanded=!tx.classList.toggle('clamp'); pm.setAttribute('aria-expanded',expanded?'true':'false'); const lab=pm.querySelector('.pm-label'); if(lab)lab.textContent=expanded?'Read less':'Read more'; } return; }
  const ib=e.target.closest('[data-info]'); if(ib){openModal(ib.getAttribute('data-info'));return;}
  if(e.target.closest('.modal-bg')||e.target.closest('.modal-x')){closeModal();return;}
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
// keyboard-activate the div-based buttons (model rows, tie cards): Enter/Space → click
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][tabindex]')){ e.preventDefault(); e.target.click(); } });

document.addEventListener('input',e=>{ if(e.target&&e.target.id==='glossq'){ const r=$('#glossres'); if(r) r.innerHTML=glossResults(e.target.value.trim()); } });
document.addEventListener('change',e=>{ if(e.target&&(e.target.id==='cmpA'||e.target.id==='cmpB')){ if(e.target.id==='cmpA')cmpA=e.target.value; else cmpB=e.target.value; const r=$('#cmp-result'); if(r) r.innerHTML=cmpResult(); } });
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
boot();
</script>

<script>
/* ════════ forest ambiance — slow drifting pollen / fireflies (faint, FPS-capped, paused when hidden, reduced-motion aware) ════════ */
(function(){
  const c=document.getElementById('pollen'); if(!c) return;
  const x=c.getContext('2d'); if(!x) return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr=Math.min(window.devicePixelRatio||1,2), FPS=24;
  let W=0,H=0,parts=[];
  const COLORS=['rgba(74,110,66,A)','rgba(96,130,80,A)','rgba(150,128,70,A)']; // muted sage + soft olive — read on the light bg
  function make(){ return {
    x:Math.random()*W, y:Math.random()*H,
    r:0.6+Math.random()*1.7,
    vx:(-0.12+Math.random()*0.24), vy:(-0.08-Math.random()*0.22),   // drift gently up + sideways
    a:0.12+Math.random()*0.28, ph:Math.random()*6.28, sp:0.006+Math.random()*0.012,
    col:COLORS[(Math.random()*COLORS.length)|0] }; }
  function size(){ W=window.innerWidth; H=window.innerHeight;
    c.width=W*dpr; c.height=H*dpr; c.style.width=W+'px'; c.style.height=H+'px'; x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(90,Math.round(W*H/15000));   // denser on small phone viewports so the ambiance actually reads
    parts=Array.from({length:n},make); }
  size(); let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(size,200);});
  let last=0, raf=0;
  function step(t){ raf=requestAnimationFrame(step); if(t-last<1000/FPS) return; last=t;
    x.clearRect(0,0,W,H);
    for(const p of parts){
      p.x+=p.vx; p.y+=p.vy; p.ph+=p.sp;
      if(p.y<-6){ p.y=H+6; p.x=Math.random()*W; }
      if(p.x<-6) p.x=W+6; else if(p.x>W+6) p.x=-6;
      const a=(p.a*(0.55+0.45*Math.sin(p.ph))).toFixed(3);   // gentle firefly pulse
      x.beginPath(); x.fillStyle=p.col.replace('A',a);
      x.arc(p.x,p.y,p.r,0,6.2832); x.fill();
    } }
  function start(){ if(!raf) raf=requestAnimationFrame(step); }
  function stop(){ cancelAnimationFrame(raf); raf=0; }
  if(reduce){ for(const p of parts){ x.beginPath(); x.fillStyle=p.col.replace('A',(p.a).toFixed(2)); x.arc(p.x,p.y,p.r,0,6.2832); x.fill(); } }
  else { start(); document.addEventListener('visibilitychange',()=>document.hidden?stop():start()); }
})();

/* ════════ fox: ambles along the top edge of the Home overview, sits at random, faces its direction ════════ */
(function(){
  const fox=document.getElementById('fox'), img=document.getElementById('fox-img'); if(!fox||!img) return;
  const WALK=['img/fox-walk-1.png','img/fox-walk-5.png','img/fox-walk-6.png','img/fox-walk-2.png','img/fox-walk-4.png','img/fox-walk-8.png','img/fox-walk-7.png','img/fox-walk-3.png'];  // 8-frame walk cycle from a single-generation sprite sheet (consistent body, no head-pop; registered bottom-center). Order chosen by min frame-to-frame change so legs flow contact→pass→opposite-contact→pass.
  const SIT='img/fox-sit.png';   // frames are bottom-anchored + uniform size; gait is baked in, no JS lift (keeps feet planted)
  WALK.concat(SIT).forEach(s=>{const p=new Image();p.src=s;});        // preload all frames
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let x=24, dir=1, mode='walk', last=0, walked=0, frame=0, modeUntil=0, curSrc='';
  const SPEED=42;                                                     // px / second — a relaxed walk
  const STEP_PX=4.5;                                                  // advance one leg frame per this many px MOVED → legs lock to motion (feet plant, no skating); 8 frames × 4.5px = ~36px stride, ~9 fps at this speed
  function homeHero(){ const h=document.getElementById('v-home'); return (h&&h.classList.contains('on'))?h.querySelector('.hero'):null; }
  function setSrc(s){ if(s!==curSrc){ curSrc=s; img.src=s; } }
  function tick(t){
    requestAnimationFrame(tick);
    const dt=last?Math.min(0.05,(t-last)/1000):0; last=t;
    const hero=homeHero();
    if(!hero){ fox.classList.add('fox-off'); return; }
    fox.classList.remove('fox-off');
    const r=hero.getBoundingClientRect();
    const b=document.body.getBoundingClientRect();   // fox is position:absolute in body's coord space → it's content, so it zooms/pans WITH the hero under pinch (fixed detached). r-b deltas are layout coords = zoom-invariant.
    const fw=fox.offsetWidth||58, fh=fox.offsetHeight||46;
    const minX=8, maxX=Math.max(minX, r.width-fw-8);
    let bob=0;
    if(reduce){ setSrc(SIT); }
    else if(mode==='walk'){
      const mv=SPEED*dt;
      x+=dir*mv; walked+=mv;                                          // distance moved drives the leg cycle
      if(x>=maxX){x=maxX;dir=-1;} else if(x<=minX){x=minX;dir=1;}
      frame=Math.floor(walked/STEP_PX)%WALK.length;
      setSrc(WALK[frame]);
      bob = 0;                                                        // no whole-sprite lift — feet stay on the ground
      if(!modeUntil) modeUntil=t+4000+Math.random()*6000;
      if(t>modeUntil){ mode='sit'; modeUntil=t+3000+Math.random()*5000; }
    } else {                                                          // sitting
      setSrc(SIT);
      if(t>modeUntil){ mode='walk'; modeUntil=t+4000+Math.random()*6000; }
    }
    fox.style.left=(r.left-b.left+x)+'px';
    fox.style.top=(r.top-b.top-fh+bob)+'px';
    img.style.transform = dir<0 ? 'scaleX(-1)' : 'none';              // sprite faces right; flip when heading left
  }
  requestAnimationFrame(tick);
  document.addEventListener('visibilitychange',()=>{ last=0; });      // avoid a dt spike after the tab was hidden
})();

</script>
